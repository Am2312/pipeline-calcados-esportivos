        ${selectBlock('Variable', `<select id="cost-index-table-variable-select" class="df-input" onchange="setCostIndexTableVariable()" style="width:200px;"><option value="blended" ${costIndexTableState.variable === 'blended' ? 'selected' : ''}>Petrochemical Cost Index</option><option value="eva" ${costIndexTableState.variable === 'eva' ? 'selected' : ''}>EVA</option><option value="pvc" ${costIndexTableState.variable === 'pvc' ? 'selected' : ''}>PVC</option><option value="rubber" ${costIndexTableState.variable === 'rubber' ? 'selected' : ''}>Rubber</option></select>`)}
        ${selectBlock('Forecast', `<select id="cost-index-table-forecast-select" class="df-input" onchange="setCostIndexTableForecast()" style="width:116px;"><option value="off" ${costIndexTableState.forecast !== 'on' ? 'selected' : ''}>No</option><option value="on" ${costIndexTableState.forecast === 'on' ? 'selected' : ''}>Yes</option></select>`)}
        ${selectBlock('From', costIndexTableSelect('cost-index-table-from-select', costIndexTableState.from, 'setCostIndexTableRange()'))}
        ${selectBlock('To', costIndexTableSelect('cost-index-table-to-select', costIndexTableState.to, 'setCostIndexTableRange()'))}
    </div>`;
}

function costIndexTableVariationRows(rows, field) {
    return Object.fromEntries(costIndexTableVariationDefs().map(def => [def.key, rows.map((row, idx) => {
        if (idx < def.lag) return null;
        const base = rows[idx - def.lag]?.[field];
        return Number.isFinite(row[field]) && Number.isFinite(base) && base ? row[field] / base - 1 : null;
    })]));
}

function costIndexTableVariationDefs() {
    if (costIndexTableState.grain === 'weekly') return [
        { key: 'wow', label: 'WoW', lag: 1 },
        { key: 'mom', label: 'MoM', lag: 4 },
        { key: 'qoq', label: 'QoQ', lag: 13 },
        { key: 'yoy', label: 'YoY', lag: 52 },
    ];
    if (costIndexTableState.grain === 'monthly') return [
        { key: 'mom', label: 'MoM', lag: 1 },
        { key: 'qoq', label: 'QoQ', lag: 3 },
        { key: 'yoy', label: 'YoY', lag: 12 },
    ];
    if (costIndexTableState.grain === 'quarterly') return [
        { key: 'qoq', label: 'QoQ', lag: 1 },
        { key: 'yoy', label: 'YoY', lag: 4 },
    ];
    return [{ key: 'yoy', label: 'YoY', lag: 1 }];
}

function costIndexTablePctCell(value) {
    const finite = Number.isFinite(value);
    const color = !finite ? C.azulEscuro40 : value < 0 ? '#B0002A' : '#00857D';
    return `<td style="padding:8px 10px;text-align:center;color:${color};font-weight:400;font-size:12px;">${finite ? fmtPctEN(value, 0) : 'n.m.'}</td>`;
}

function costIndexTableBlock(rows, field, title, rowBg, borderColor, withSpacer=false, allRows=rows) {
    const allChanges = costIndexTableVariationRows(allRows, field);
    const rowIndex = new Map(allRows.map((row, idx) => [row.key, idx]));
    const changes = Object.fromEntries(Object.entries(allChanges).map(([key, values]) => [key, rows.map(row => values[rowIndex.get(row.key)] ?? null)]));
    const spacer = withSpacer ? `<tr aria-hidden="true"><td colspan="${rows.length + 1}" style="height:18px;background:#FFFFFF;border:0;padding:0;"></td></tr>` : '';
    const valueRow = `<tr style="border-bottom:1px solid ${borderColor};background:${rowBg};">
        <td class="imports-table-sticky" style="background:${rowBg};padding:10px 12px;color:${C.azulEscuro};font-weight:800;font-size:13px;border-right:1px solid ${borderColor};">${title}</td>
        ${rows.map(row => `<td style="background:${rowBg};padding:9px 10px;text-align:center;color:${C.azulEscuro};font-weight:800;font-size:13px;">${fmtCostValue(row[field])}</td>`).join('')}
    </tr>`;
    const changeRow = (label, values, isLast=false) => `<tr style="border-bottom:${isLast ? '0' : '1px solid #E8ECF0'};background:#FFFFFF;">
        <td class="imports-table-sticky" style="background:#FFFFFF;padding:8px 12px 8px 24px;color:${C.azulEscuro};font-weight:400;font-size:13px;border-right:1px solid #E8ECF0;">${label}</td>
        ${values.map(value => costIndexTablePctCell(value)).join('')}
    </tr>`;
    const defs = costIndexTableVariationDefs();
    return `${spacer}${valueRow}${defs.map((def, idx) => changeRow(def.label, changes[def.key], idx === defs.length - 1)).join('')}`;
}

function renderCostIndexTableCard(replaceOnly=false) {
    ensureCostIndexTableRange();
    const content = document.getElementById('tab-content');
    const existing = document.getElementById('cost-index-table-card');

    const headerRow = `<tr>

    </tr>`;
    card.innerHTML = `
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;width:100%;margin-bottom:12px;">
            <div style="align-self:flex-start;">
                <h3 style="color:${C.azulEscuro};font-size:15px;font-weight:700;letter-spacing:0.04em;margin:0 0 4px 0;">Cost Index Table</h3>
                <p style="color:${C.azulEscuro60};font-size:12px;margin:0;">(x, average of weekly observations)</p>

        <div id="cost-index-table-scroll" class="imports-table-scroll">
            <table class="imports-matrix-table">
                <thead>${headerRow}</thead>
                <tbody>
                    ${costIndexTableBlock(rows, 'usd', `${cfg.label} USD`, '#D6E6F3', '#C6D8E8', false, allRows)}
                    ${costIndexTableBlock(rows, 'brl', `${cfg.label} BRL`, '#A7DDDB', '#8BC4C2', true, allRows)}
                </tbody>
            </table>
        </div>`;
    if (!existing) content.appendChild(card);
    const scroller = document.getElementById('cost-index-table-scroll');
    if (scroller) scroller.scrollLeft = scroller.scrollWidth;

/* ===== Cost Index — Lag table (Spot month → quando bate em VULC/Peers) =====
   O preço spot de um mês impacta o resultado da Vulcabras +5 meses depois e o
   dos concorrentes +10 meses depois (giro de estoque). Como o resultado é
   trimestral, mapeia mês+5 / mês+10 pro trimestre que os contém. Índice mensal
   = média das semanas (blended/Petrochemical). Currency USD/BRL, range From/To
   mensal e Forecast (flat-forward 52 semanas, igual à tabela existente). */
const ciLagState = { currency: 'usd', forecast: 'off', from: null, to: null };

// RECEITA ÚNICA: o modelo da tabela mora em window.buildCostIndexLagModel (charts-registry.js) — mesma fn que o PPT usa.
function ciLagModel() {
    if (!window.buildCostIndexLagModel) return { currency: ciLagState.currency, forecast: ciLagState.forecast, from: null, to: null, months: [], rows: [] };
    const m = window.buildCostIndexLagModel(ciLagState);
    ciLagState.from = m.from;   // sincroniza o range resolvido de volta nos seletores
    ciLagState.to = m.to;
    return m;
}

function ciLagSelect(id, current, onchangeFn, months) {
    return `<select id="${id}" class="df-input" onchange="${onchangeFn}" style="width:116px;">${months.map(r => `<option value="${r.key}" ${current === r.key ? 'selected' : ''}>${r.label}</option>`).join('')}</select>`;
}

function ciLagControlsHtml(months) {
    return `<div class="imports-controls" style="display:flex;align-items:center;justify-content:flex-end;gap:24px;flex-wrap:wrap;margin-left:auto;">
        ${selectBlock('Currency', `<select id="ci-lag-currency" class="df-input" onchange="setCiLagCurrency()" style="width:104px;"><option value="usd" ${ciLagState.currency === 'usd' ? 'selected' : ''}>USD</option><option value="brl" ${ciLagState.currency === 'brl' ? 'selected' : ''}>BRL</option></select>`)}
        ${selectBlock('From', ciLagSelect('ci-lag-from', ciLagState.from, 'setCiLagRange()', months))}
        ${selectBlock('To', ciLagSelect('ci-lag-to', ciLagState.to, 'setCiLagRange()', months))}
        ${selectBlock('Forecast', `<select id="ci-lag-forecast" class="df-input" onchange="setCiLagForecast()" style="width:90px;"><option value="off" ${ciLagState.forecast === 'off' ? 'selected' : ''}>Off</option><option value="on" ${ciLagState.forecast === 'on' ? 'selected' : ''}>On</option></select>`)}
    </div>`;
}

function ciLagFmtIndex(v) { return Number.isFinite(v) ? v.toFixed(2) : '-'; }
function ciLagFmtYoY(v) {   // heat-map de texto: verde se sobe, vermelho se cai (igual à tabela YoY do print)
    if (!Number.isFinite(v)) return `<span style="color:#667D99;">n.a.</span>`;
    const p = Math.round(v * 100);
    const color = p > 0 ? '#0D8B80' : p < 0 ? '#C2384E' : C.azulEscuro;
    return `<span style="color:${color};font-weight:700;">${p > 0 ? '+' : ''}${p}%</span>`;
}

function setCiLagCurrency() { const el = document.getElementById('ci-lag-currency'); if (el) ciLagState.currency = el.value; renderCostIndexLagCard(true); }
function setCiLagForecast() { const el = document.getElementById('ci-lag-forecast'); if (el) ciLagState.forecast = el.value; ciLagState.from = null; ciLagState.to = null; renderCostIndexLagCard(true); }
function setCiLagRange() { const f = document.getElementById('ci-lag-from'), t = document.getElementById('ci-lag-to'); if (f) ciLagState.from = f.value; if (t) ciLagState.to = t.value; if (ciLagState.from > ciLagState.to) [ciLagState.from, ciLagState.to] = [ciLagState.to, ciLagState.from]; renderCostIndexLagCard(true); }

function renderCostIndexLagCard() {
    const content = document.getElementById('tab-content');
    const model = ciLagModel();

    const existing = document.getElementById('cost-index-lag-card');
    const card = existing || document.createElement('section');

            <td style="${td}">${r.vulcQ}</td>
            <td style="${td}">${r.peersQ}</td>
            <td style="${td};font-weight:700;${r.forecast ? 'background:#FFFDE7;color:#4472C4;' : ''}">${ciLagFmtIndex(r.index)}</td>
            <td style="${td}">${ciLagFmtYoY(r.yoy)}</td>

    }).join('');
    card.innerHTML = `
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;width:100%;margin-bottom:12px;">
            <div style="align-self:flex-start;">
                <h3 style="color:${C.azulEscuro};font-size:15px;font-weight:700;letter-spacing:0.04em;margin:0 0 4px 0;">Petrochemical Cost Index Effects on Company's Results</h3>

                    ${th('Spot', '#082654')}${th('VULC Result', '#082654')}${th('Peers Result', '#082654')}${th('Index ' + cur.toUpperCase(), C.cereja)}${th('YoY', C.cereja)}

    if (!existing) content.appendChild(card);
    renderCostIndexLagCompareCard();
}

/* ===== Cost Index — Effect on the Company's Results (YoY) =====
   Card abaixo da tabela de lag, com CONTROLES PRÓPRIOS (ciLagCompareState):
   Currency (USD/BRL), From/To por TRIMESTRE, Forecast On/Off.
   Eixo = trimestres no range escolhido. Por trimestre Q:
     Index for Vulcabras = YoY do custo médio de (Q − VULC_MONTHS)  [verticalizada: custo chega antes]
     Index for Peers     = YoY do custo médio de (Q − PEERS_MONTHS)
   YoY = média trimestral do índice ÷ mesmo trimestre do ano anterior − 1. */
const ciLagCompareState = { currency: 'brl', forecast: 'on', from: '2026-Q1', to: '2028-Q1' };

function setCiLagCompareCurrency() { const el = document.getElementById('ci-lag-cmp-currency'); if (el) ciLagCompareState.currency = el.value; renderCostIndexLagCompareCard(); }
function setCiLagCompareForecast() { const el = document.getElementById('ci-lag-cmp-forecast'); if (el) ciLagCompareState.forecast = el.value; ciLagCompareState.from = null; ciLagCompareState.to = null; renderCostIndexLagCompareCard(); }
function setCiLagCompareRange() { const f = document.getElementById('ci-lag-cmp-from'), t = document.getElementById('ci-lag-cmp-to'); if (f) ciLagCompareState.from = f.value; if (t) ciLagCompareState.to = t.value; renderCostIndexLagCompareCard(); }

function renderCostIndexLagCompareCard() {
    const content = document.getElementById('tab-content');
    const m = window.buildCostIndexLagModel
        ? window.buildCostIndexLagModel({ currency: ciLagCompareState.currency, forecast: ciLagCompareState.forecast })
        : { currency: ciLagCompareState.currency, forecast: ciLagCompareState.forecast, months: [], VULC_MONTHS: 5, PEERS_MONTHS: 10 };
    const cur = m.currency;
    const VULC = m.VULC_MONTHS || 5, PEERS = m.PEERS_MONTHS || 10;
    const qOf = mm => Math.floor((mm - 1) / 3) + 1;
    const qLabel = (y, q) => q + 'Q' + String(y).slice(-2);
    const qKey = (y, q) => y + '-Q' + q;
    const qAbs = (y, q) => y * 4 + (q - 1);
    const parseQ = k => { const p = String(k).split('-Q'); return { y: +p[0], q: +p[1] }; };
    const amOf = (y, mm) => y * 12 + (mm - 1);
    // índice mensal (moeda atual) + flag forecast, indexados pelo mês absoluto
    const idxByAm = new Map(), fcByAm = new Map();
    let lastAm = -Infinity, lastVal = null;
    (m.months || []).forEach(mo => {
        const a = amOf(mo.year, mo.month);
        idxByAm.set(a, mo[cur]); fcByAm.set(a, mo.forecast);
        if (a > lastAm && Number.isFinite(mo[cur])) { lastAm = a; lastVal = mo[cur]; }
    });
    const fcOn = (m.forecast === 'on');
    // índice de um mês: real/flat do modelo; ou, c/ Forecast On, estica o flat-forward além do
    // horizonte do modelo (segura o último custo) — assim a Vulcabras preenche 1Q28 etc.
    const getIdx = a => {
        if (idxByAm.has(a) && Number.isFinite(idxByAm.get(a))) return { val: idxByAm.get(a), fc: fcByAm.get(a) === true };
        if (fcOn && Number.isFinite(lastVal) && a > lastAm) return { val: lastVal, fc: true };
        return null;
    };
    // média do custo que bate no trimestre (ry,rq) com defasagem L meses (spot = trimestre − L)
    const laggedAvg = (ry, rq, L) => {
        const startM = (rq - 1) * 3 + 1;
        const got = [0, 1, 2].map(k => getIdx(amOf(ry, startM + k) - L)).filter(Boolean);
        if (!got.length) return null;   // n.a. só quando não há nenhum dado-fonte (ex.: Forecast Off além do real)
        return { avg: got.reduce((s, x) => s + x.val, 0) / got.length, forecast: got.some(x => x.fc) };
    };
    const laggedYoY = (ry, rq, L) => {
        const c = laggedAvg(ry, rq, L), p = laggedAvg(ry - 1, rq, L);
        if (!c || !p || !p.avg) return null;
        return { yoy: c.avg / p.avg - 1, forecast: c.forecast };
    };
    // todos os TRIMESTRES DE RESULTADO disponíveis = união dos mapeamentos +VULC (Vulcabras) e
    // +PEERS (peers) de cada mês spot. (Assim o eixo alcança o mesmo horizonte da tabela de lag:
    // o último spot em forecast + PEERS define o último trimestre, ex. 1Q28.)
    const qseen = new Map();
    (m.months || []).forEach(mo => {
        [VULC, PEERS].forEach(L => {
            const am = amOf(mo.year, mo.month) + L;
            const y = Math.floor(am / 12), q = qOf((am % 12) + 1), k = qKey(y, q);
            if (!qseen.has(k)) qseen.set(k, { y: y, q: q, key: k, label: qLabel(y, q), abs: qAbs(y, q) });
        });
    });
    const allQ = Array.from(qseen.values()).sort((a, b) => a.abs - b.abs);
    const keys = allQ.map(x => x.key);
    // resolve from/to (default From = 1º trimestre do ano corrente; To = último trimestre)
    let from = ciLagCompareState.from, to = ciLagCompareState.to;
    const defFrom = qKey((new Date()).getFullYear(), 1);
    if (!from || keys.indexOf(from) < 0) from = keys.indexOf(defFrom) >= 0 ? defFrom : keys[0];
    if (!to || keys.indexOf(to) < 0) to = keys[keys.length - 1];
    if (keys.length && keys.indexOf(from) > keys.indexOf(to)) { const tmp = from; from = to; to = tmp; }
    ciLagCompareState.from = from; ciLagCompareState.to = to;
    const fromAbs = from ? qAbs(parseQ(from).y, parseQ(from).q) : -Infinity;
    const toAbs = to ? qAbs(parseQ(to).y, parseQ(to).q) : Infinity;
    const quarters = allQ.filter(x => x.abs >= fromAbs && x.abs <= toAbs);

    const qSelect = (id, current) => `<select id="${id}" class="df-input" onchange="setCiLagCompareRange()" style="width:96px;">${allQ.map(x => `<option value="${x.key}" ${current === x.key ? 'selected' : ''}>${x.label}</option>`).join('')}</select>`;
    const controls = `<div class="imports-controls" style="display:flex;align-items:center;justify-content:flex-end;gap:24px;flex-wrap:wrap;margin-left:auto;">
        ${selectBlock('Currency', `<select id="ci-lag-cmp-currency" class="df-input" onchange="setCiLagCompareCurrency()" style="width:104px;"><option value="usd" ${cur === 'usd' ? 'selected' : ''}>USD</option><option value="brl" ${cur === 'brl' ? 'selected' : ''}>BRL</option></select>`)}
        ${selectBlock('From', qSelect('ci-lag-cmp-from', from))}
        ${selectBlock('To', qSelect('ci-lag-cmp-to', to))}
        ${selectBlock('Forecast', `<select id="ci-lag-cmp-forecast" class="df-input" onchange="setCiLagCompareForecast()" style="width:90px;"><option value="off" ${m.forecast === 'off' ? 'selected' : ''}>Off</option><option value="on" ${m.forecast === 'on' ? 'selected' : ''}>On</option></select>`)}
    </div>`;

    const existing = document.getElementById('cost-index-lag-compare-card');
    const card = existing || document.createElement('section');
    card.id = 'cost-index-lag-compare-card';
    card.style.cssText = cardStyle('margin-bottom:24px;');
    const th = (txt, bg) => `<th style="padding:7px 16px;background:${bg};color:#FFFFFF;font-size:12px;font-weight:700;text-align:center;white-space:nowrap;">${txt}</th>`;
    const tdBase = `padding:5px 16px;text-align:center;font-size:13px;color:${C.azulEscuro};`;
    const body = quarters.map(qq => {
        const va = laggedAvg(qq.y, qq.q, VULC), vy = laggedYoY(qq.y, qq.q, VULC);
        const pa = laggedAvg(qq.y, qq.q, PEERS), py = laggedYoY(qq.y, qq.q, PEERS);
        const isFc = (va && va.forecast) || (pa && pa.forecast);
        const idxCell = a => `<td style="${tdBase}font-weight:700;">${a ? ciLagFmtIndex(a.avg) : '-'}</td>`;
        const yoyCell = y => `<td style="${tdBase}">${ciLagFmtYoY(y ? y.yoy : NaN)}</td>`;
        return `<tr>
            <td style="${tdBase}font-weight:700;">${qLabel(qq.y, qq.q)}${isFc ? 'E' : ''}</td>
            ${idxCell(va)}${yoyCell(vy)}
            ${idxCell(pa)}${yoyCell(py)}
        </tr>`;
    }).join('');
    card.innerHTML = `
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;width:100%;margin-bottom:12px;">
            <div style="align-self:flex-start;">
                <h3 style="color:${C.azulEscuro};font-size:15px;font-weight:700;letter-spacing:0.04em;margin:0 0 4px 0;">Cost Index — Effect on the Company's Results</h3>
                <p style="color:${C.azulEscuro60};font-size:12px;margin:0;">(Percentage)</p>
            </div>
            ${controls}
        </div>
        <div style="overflow-x:auto;">
            <table style="border-collapse:collapse;min-width:620px;">
                <thead><tr>${th('Quarter', '#082654')}${th('Index for Vulcabras', '#082654')}${th('YoY', '#082654')}${th('Index for Peers', C.cereja)}${th('YoY', C.cereja)}</tr></thead>
                <tbody>${body}</tbody>
            </table>
        </div>${m.forecast === 'on' ? `<div style="margin-top:8px;font-size:11px;color:${C.azulEscuro60};">E = inclui custo em forecast (último valor mantido constante)</div>` : ''}`;
    if (!existing) content.appendChild(card);
}

function renderRegistryChart(def) {

    const card = document.createElement('div');
    card.style.cssText = 'background:#fff;border-radius:14px;padding:24px 28px 28px;max-width:1800px;margin:0 auto;box-shadow:0 1px 3px rgba(2,28,69,0.08);';
    card.innerHTML =
        '<div style="font-size:18px;font-weight:800;color:#021C45;">' + (def.titulo || def.id) + '</div>' +
        '<div style="font-size:12px;color:#667D99;margin:2px 0 18px;">' + (def.unidade || '') + '</div>' +
        '<div class="registry-controls" style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px;"></div>' +
        '<div style="position:relative;height:520px;"><canvas id="' + canvasId + '"></canvas></div>';
    content.appendChild(card);

    const cv = document.getElementById(canvasId);
    const draw = function() { const ex = Chart.getChart(cv); if (ex) ex.destroy(); def.desenhar(cv); };

    const ctlBox = card.querySelector('.registry-controls');
    const controles = Array.isArray(def.controles) ? def.controles : [];
    controles.forEach(function(c) {
        const ops = (typeof c.opcoes === 'function' ? c.opcoes() : (c.opcoes || []));
        const sel = document.createElement('select');
        sel.className = 'control-select';
        sel.innerHTML = ops.map(function(o) {
            const v = (o && o.v !== undefined) ? o.v : o;
            const t = (o && o.t !== undefined) ? o.t : v;
            return '<option value="' + v + '">' + t + '</option>';
        }).join('');
        if (c.get) { const v = c.get(); if (v != null) sel.value = v; }
        sel.addEventListener('change', function(e) { if (c.set) c.set(e.target.value); draw(); });
        const lbl = document.createElement('label');
        lbl.className = 'control-block';
        lbl.innerHTML = '<span class="control-label" style="color:#667D99;">' + (c.label || c.key) + '</span>';
        lbl.appendChild(sel);
        ctlBox.appendChild(lbl);
    });
    if (!controles.length) ctlBox.style.display = 'none';

    draw();
}

    const lead = `
      <div class="gcv-lead">
        Most of the world's sneakers aren't made by the brands — they're outsourced to a handful of Asian contract manufacturers. Two of them, Taiwan's <b>Pou Chen</b> (through its Yue Yuen arm) and <b>Feng Tay</b>, together build the large majority of Nike's footwear — on the order of <b>~70% of Nike's shoes</b> — while Pou Chen alone makes <b>roughly a third of adidas's</b>. These factories sit one step below the brands and one step above the raw materials, so what they say about input costs is an early read on the entire chain. Their soles and midsoles use petroleum-derived inputs — EVA, rubber and PVC — the very materials Vulcabras buys, sourced in Brazil largely from <b>Braskem</b>, whose own feedstock (naphtha) is priced off oil. When crude rises, the squeeze shows up first in Braskem's spreads and in these manufacturers' margins — months before it reaches Vulcabras and the brands. Tracking what <b>Pou Chen, Feng Tay, Braskem, Nike and adidas</b> — and the sector around them — say each quarter gives a live, bottom-up gauge of that cost pressure.
      </div>`;

    const themes = `<div class="gcv-themes">
        <h3>O que os reports e as notícias dizem — por camada</h3>
        <p><b>(i) Reports e resultados das marcas (Nike, adidas, Puma, On, Under Armour, ASICS, Mizuno).</b> O assunto que domina, de longe, é tarifa dos EUA — Nike levou ~300bp de margem bruta e já pagou ~US$1,0bn de tarifa IEEPA não-recuperável; adidas guiou um baque de ~€400m de tarifa+câmbio; On carrega 20% de tarifa sobre o sourcing do Vietnã; ASICS e Mizuno citam a tarifa como o motivo da queda de margem nas Américas. Em segundo lugar vêm demanda fraca e ambiente promocional — o reset da China na Nike (−20%), o consumidor europeu pressionado, markdowns elevados e marketplace "too promotional". A margem é analisada via "bridges" onde tarifa e câmbio mandam, e petróleo/matéria-prima aparece só como risco à frente (Nike/BofA: "higher oil prices will push product costs higher"; adidas: o óleo "já move discussões de preço de material e transporte, mas sem aumento de preço de produto ainda"). O saldo: ações de-ratadas no ano (Nike ~−28%, adidas ~−16%), com rebaixamentos — exceto On, que segue performando no operacional via full-price premium.</p>
        <p><b>(ii) Reports e resultados das fabricantes / OEMs (Pou Chen/Yue Yuen, Feng Tay).</b> Aqui o tema central é compressão de margem (Yue Yuen: margem bruta de manufatura 14,8%; Feng Tay: 17,4%), mas a causa não é matéria-prima — é rateio de tarifa com as marcas (Yue Yuen passou a dividir com 4 clientes, vs nenhum no 1S25), mão de obra subindo e ineficiência de produção ao realocar fábrica da China pro Sudeste Asiático e por sobreposição de feriados (Ano Novo Chinês + Ramadã/Eid). Soma-se demanda cautelosa das marcas, visibilidade de pedido baixa (~2-3 meses) e dependência do turnaround da Nike. O petróleo/petroquímico é tratado a fundo só numa nota temática do Goldman ("Gauging the rising crude oil cost impact"), que quantifica o que importa pra sua tese — 60-70% da matéria-prima de um tênis é petroquímico (EVA, borracha, PU), e MP é ~metade do COGS — mas conclui que, pelo modelo cost-plus/FOB, esse custo é repassado às marcas, com defasagem (oil-linked inputs em mid-teens% do COGS). Os bancos esperam recuperação sequencial da margem no 2S26 e divergem no rating (Goldman Sell em Feng Tay, BofA Buy).</p>
        <p><b>(iii) Notícias do setor.</b> É na imprensa setorial que o elo óleo → custo do calçado aparece mais claramente. A FDRA publicou um estudo dimensionando a exposição (óleo é feedstock direto de ~30% dos materiais de um tênis sintético, ~70% têm exposição ao petróleo; se o Brent ficar acima de US$90, o custo FOB sobe 1,5-3% por par); o EVA (entressola) subiu +13% nos EUA e +17% no Brasil; o Brent disparou de ~US$71 pra >US$100 com o fechamento do Estreito de Ormuz; o frete saltou 30-40% e a Maersk falou em +US$500m/mês de combustível, "passing on these costs to customers". Do lado do consumidor, o preço do calçado nos EUA já sobe no ritmo mais rápido em 3+ anos (custo desembarcado por par +13,7% a/a), e no Brasil a Abicalçados projeta exportações −4 a −9% em 2026. O enquadramento da mídia é de um coquetel de custo — petróleo + Oriente Médio + tarifa + frete — pressionando a cadeia, com o repasse ao preço final já visível, mas ainda sem ter batido cheio nos resultados das empresas.</p>
    </div>`;

    content.innerHTML = '<style>' + css + '</style><div class="gcv-wrap">' + themes + lead + '<div class="gcv-tl">' + cards + '</div>' + legend + '</div>';
}

function renderContent() {
    // Destroy ecom chart instances before wiping DOM (prevents orphaned Chart.js references)
    if (window._ecomDestroy) window._ecomDestroy();
    const content = document.getElementById('tab-content');
    content.innerHTML = '';
    // ÍNDICE COMPARTILHADO: se a aba ativa é um gráfico NÃO-nativo do registry, renderiza e sai.
    // (dashboardNative = o dashboard já desenha nativamente; nunca rotear pelo registry — evita
    //  colisão de id com abas hard-coded, ex: 'imports-data', e o uso de DASH ausente aqui.)
    const _regDef = (window.DASHBOARD_CHARTS || []).find(function(d) { return d.id === activeTab && !d.dashboardNative; });
    if (_regDef) {
        renderRegistryChart(_regDef);
        document.getElementById('footer-source').textContent = _regDef.fonte || '';
        return;
    }
    if (activeTab === 'ecom-data') {
        renderEcomDataTab();
        return;
    }
    if (activeTab === 'global-companies') {
        renderGlobalCompaniesPage();
        document.getElementById('footer-source').textContent = 'Source: company results & earnings calls, sell-side research, and sector/market news (Mar–May 2026)';
        return;
    }
    if (activeTab === 'methodology') {
        renderMethodologyPage();
        document.getElementById('footer-source').textContent = 'Fonte: relatórios da Vulcabras, Novo CAGED / MTE, RAIS / MTE e registros públicos de CNPJ';
        return;
    }
    if (activeTab === 'caged') {
        renderCagedCard();
        document.getElementById('footer-source').textContent = '';
        return;
    }
    if (activeTab === 'vivara-caged') {
        renderVivaraCagedPage();
        document.getElementById('footer-source').textContent = 'Source: Novo CAGED / MTE CAGEDMOV public microdata, CVM Formulario de Referencia 2025 V9 and Vivara RI';
        return;
    }
    if (activeTab === 'industry-data') {
        renderIndustryDataCard();
        document.getElementById('footer-source').textContent = 'Source: Abicalcados sector reports 2017-2025 / IBGE production segmentation';
        return;
    }
    if (activeTab === 'market-share') {
        renderMarketShareCard();
        document.getElementById('footer-source').textContent = 'Source: Euromonitor Brand Shares (Sportswear), retail value RSP. Vulcabras = Olympikus + Mizuno + Under Armour.';
        return;
    }
    if (activeTab === 'mizuno') {
        renderMizunoTab();
        document.getElementById('footer-source').textContent = 'Source: Mizuno Global IR (Brazil local-distributor sales); FX Bloomberg USDBRL/USDJPY quarterly average';
        return;
    }
    if (activeTab === 'cost-index') {
        renderCostIndexCard();
        renderCostIndexLagCard();
        renderCostIndexTableCard();
        document.getElementById('footer-source').textContent = 'Source: Bloomberg / BigQuery table constellation_vibe_coding.sports_retail_cost_indices_weekly';
        return;
    }
    renderImportsDataCard();
    renderImportsTableCard();
    document.getElementById('footer-source').textContent = 'Source: Comex Stat / MDIC, imports by NCM 6404.11.00 and 6402.19.00';
}

document.addEventListener('DOMContentLoaded', function() {
    // ÍNDICE COMPARTILHADO: gráficos do registry que ainda não são abas hard-coded viram abas novas (no fim).
    (window.DASHBOARD_CHARTS || []).forEach(function(d) {

        if (!TABS.some(function(t) { return t.id === d.id; })) TABS.push({ id: d.id, label: d.titulo || d.id });

});

                        <select class="control-select" id="fr-window" onchange="window._frRender && window._frRender()">
                            <option value="1w">Δ WoW</option>
                            <option value="1m">Δ MoM</option>
                            <option value="3m">Δ QoQ</option>
                            <option value="1y">Δ YoY</option>
                            <option value="ytd" selected>Δ YTD</option>
                        </select>
                    </div>
                    <div class="control-block">
                        <div class="control-label">Granularity</div>
                        <select class="control-select" id="fr-gran" onchange="window._frRender && window._frRender()" style="min-width:130px;">
                            <option value="weekly" selected>Weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="quarterly">Quarterly</option>
                            <option value="annual">Annual</option>
                        </select>
                    </div>
                    <div class="control-block">
                        <div class="control-label">From</div>

                    </div>
                    <div class="control-block">

        <div style="position:relative;height:500px;margin-top:4px;overflow:hidden;">
            <div class="chart-legend-inline" id="fr-legend"></div>
            <canvas id="fr-chart" style="position:absolute;left:0;top:0;width:100%;height:100%;"></canvas>
        </div>
        <div id="fr-table" style="margin-top:16px;"></div>
    </section>


    <!-- Methodology -->
    <section class="chart-card" id="methodology-card">
        <h3 style="color:#021C45;font-size:15px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;margin:0 0 24px 0;">Methodology</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px 48px;">

            <div>
                <p style="font-size:11px;font-weight:700;color:#021C45;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 8px 0;border-bottom:1px solid #EBEBEB;padding-bottom:6px;">Data Sources</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;">5 channels tracked weekly:</p>
                <ul style="font-size:12px;color:#344F75;margin:0 0 8px 0;padding-left:18px;line-height:1.8;">
                    <li><strong>Olympikus</strong> — olympikus.com.br (official website)</li>
                    <li><strong>Mizuno</strong> — mizuno.com.br (official website)</li>
                    <li><strong>Centauro</strong> — centauro.com.br (marketplace)</li>
                    <li><strong>Direct</strong> — adidas.com.br + nike.com.br + asics.com.br + underarmour.com.br</li>
                    <li><strong>Netshoes</strong> — netshoes.com.br</li>
                </ul>
                <p style="font-size:11px;color:#9AA8BB;margin:0 0 6px 0;line-height:1.6;">
                    BQ tables: <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">olympikus_trusted</code>, <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">mizuno_trusted</code>, <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">centauro_trusted</code>, <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">under_armour_trusted</code>, <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">usr_andre_adidas_nike_product_snapshot_2026_05_15</code>, <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">usr_andre_netshoes_product_snapshot_2026_05_15</code>
                </p>
                <p style="font-size:11px;color:#9AA8BB;margin:0;line-height:1.6;">
                    <strong>UA Website source note:</strong> Adidas / Nike / Asics Website data comes from the scraper (started 2026-05-15). Under Armour Website data comes from <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">under_armour_trusted</code> (Aster, since 2024-04) for a long historical series consistent with Olympikus / Mizuno / Centauro. Filters (footwear-only via <code>subcategory_name = 'Calçados'</code>, available SKUs, prices &gt; 0) and cat mapping (DIRECT_CAT_MAP) are identical to the scraper path. Adidas / Nike / Asics Website still only shows from Mai/26 until those scrapers accumulate history (or a trusted table exists). For Olympikus and Mizuno, the same Aster trusted tables feed all 4 dashboard cards.
                </p>
            </div>

            <div>
                <p style="font-size:11px;font-weight:700;color:#021C45;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 8px 0;border-bottom:1px solid #EBEBEB;padding-bottom:6px;">Data Grain</p>
                <ul style="font-size:12px;color:#344F75;margin:0;padding-left:18px;line-height:1.9;">
                    <li><strong>Direct / Netshoes:</strong> <strong>colorway level</strong> (model + color) — confirmed: Adidas, Nike, Asics and Under Armour do not vary price by size; all sizes of the same colorway share one price</li>
                    <li><strong>Olympikus / Mizuno:</strong> EAN level (model + color + size) via Aster pipelines</li>
                    <li><strong>Centauro:</strong> EAN level after seller deduplication — see below</li>
                </ul>
            </div>

            <div>
                <p style="font-size:11px;font-weight:700;color:#021C45;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 8px 0;border-bottom:1px solid #EBEBEB;padding-bottom:6px;">Channel = Total (all 4 cards)</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;">When <strong>Channel = Total</strong> is selected (or shown as the Total line in Channel Breakdown), the four cards aggregate Website + Centauro + Netshoes using the <strong>same rule</strong>, so numbers can be compared head-to-head across cards.</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;font-family:Verdana,Geneva,sans-serif;text-align:center;background:#F7F8FA;padding:8px;border-radius:4px;">
                    Total<sub>brand, t</sub> = ( mean<sub>Website</sub> + mean<sub>Centauro</sub> + mean<sub>Netshoes</sub> ) / 3
                </p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;"><strong>Two-stage aggregation:</strong></p>
                <ol style="font-size:12px;color:#344F75;margin:0 0 6px 0;padding-left:18px;line-height:1.8;">
                    <li><strong>Within each channel</strong> — SKU-weighted mean across all rows (categories, franchises) of that channel × brand × week.</li>
                    <li><strong>Across channels</strong> — simple arithmetic mean of the three channel-level means (each channel weighs 1/3).</li>
                </ol>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;"><strong>Why simple mean across channels (not SKU-weighted pool):</strong> each scraper counts SKUs at a different grain — Direct (Adidas/Nike/Asics/UA sites) counts colorways, Olympikus/Mizuno count EANs (model+color+size), Centauro counts EANs after seller dedup, Netshoes counts at colorway level. These row counts are <em>not directly comparable</em>: an EAN-grain channel can have ~5–10× more rows than a colorway-grain channel for the same real catalog. SKU-weighted pooling across channels would systematically over-weight finer-grain channels (mostly Centauro), so we use 1/3 each — a deliberately conservative, comparable rule.</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;"><strong>All 3 channels required:</strong> a week only enters the Total if it has data in <em>all</em> of Website, Centauro, and Netshoes. Since Netshoes coverage started 2026-05-15, Total time series will only start populating from that week onwards — historical Total will fill in as the series grows. For Price Pass-Through, "data in a channel" means the brand has at least one franchise with rows there.</p>
                <p style="font-size:12px;color:#344F75;margin:0;line-height:1.7;">Applied identically to: <strong>Average Price</strong>, <strong>% Discounted SKUs</strong>, <strong>Average Discount</strong>, <strong>Price Pass-Through</strong>. Same sport scope and category filters as the single-channel views.</p>
            </div>

            <div>
                <p style="font-size:11px;font-weight:700;color:#021C45;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 8px 0;border-bottom:1px solid #EBEBEB;padding-bottom:6px;">% SKUs with Discount</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;"><code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">COUNTIF(sale_price &lt; list_price) / COUNT(*)</code> at model level, by week and category.</p>
                <p style="font-size:12px;color:#344F75;margin:0;line-height:1.7;">A model is "discounted" when its sale price is strictly below its listed price.</p>
            </div>

            <div>
                <p style="font-size:11px;font-weight:700;color:#021C45;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 8px 0;border-bottom:1px solid #EBEBEB;padding-bottom:6px;">Average Discount</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;">Simple mean of <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">(1 − sale/list)</code> across discounted models per week &amp; category.</p>
                <p style="font-size:12px;color:#344F75;margin:0;line-height:1.7;">When aggregating categories, weighted average by <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">n_disc</code> (number of discounted models).</p>
            </div>

            <div>
                <p style="font-size:11px;font-weight:700;color:#021C45;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 8px 0;border-bottom:1px solid #EBEBEB;padding-bottom:6px;">Franchise Pass-Through</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;">Replaces the previous same-SKU view (deprecated 2026-05-22 night) with two complementary methods at the <strong>franchise</strong> level (e.g. Pegasus, Ultraboost, Corre 4, Gel-Nimbus). Franchises are mapped via a human-curated regex table (<code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">franchise_mapping.py</code>) — ~458 franchises across the 6 brands, with ~80% catalog coverage on average.</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;"><strong>Method A — Average vs Average:</strong> for each (brand, franchise) and date <em>t</em>:</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;font-family:Verdana,Geneva,sans-serif;text-align:center;background:#F7F8FA;padding:8px;border-radius:4px;">
                    var<sub>w</sub>(franchise, t) = (AVG(price<sub>franchise, t</sub>) − AVG(price<sub>franchise, prev_window</sub>)) / AVG(price<sub>franchise, prev_window</sub>)
                </p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;">Underlying SKU sets in <em>t</em> and the reference window can be different — the comparison is between catalog snapshots of the same franchise label.</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;"><strong>Method B — Generation vs Generation:</strong> identifies the most-recent generation of each franchise (e.g. Pegasus 42, Corre 5) by <strong>first-seen date in the catalog</strong> (not by numeric label — handles Adidas Ultraboost 22 → 5 renumbering). Compares the latest gen at <em>t</em> against the gen that was most-recent at the reference window start.</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;">Same 5 windows as before: WoW (prev ISO week) / MoM (prev cal month) / QoQ (month 3 back) / YoY (same month prev year) / YTD (Dec prev year). Computed independently for <strong>sale</strong> and <strong>list</strong>.</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;"><strong>Sport scope filter:</strong> uses the curated <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">sport</code> field per franchise (corrida / training / trail / casual / etc.) — divergent from other dashboard cards which filter by raw BQ category. The tradeoff: stable franchise classification at the cost of letting through ~5% of SKUs cadastered with inconsistent categories on the source.</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;"><strong>Views available:</strong></p>
                <ul style="font-size:12px;color:#344F75;margin:0 0 6px 0;padding-left:18px;line-height:1.8;">
                    <li><strong>Company Comparison</strong> — one line per brand at the selected channel</li>
                    <li><strong>Channel Breakdown</strong> — one line per channel for the selected brand</li>
                    <li><strong>Model Breakdown</strong> — for the selected brand × channel, plots the top 8 franchises by SKU volume (one line per franchise)</li>
                </ul>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;"><strong>Aggregation rule (Company Comparison and Channel Breakdown):</strong> the brand-level (or channel-level) number is the <strong>SKU-weighted mean of the per-franchise Δs</strong>, not the Δ of the SKU-weighted average price. Each franchise enters the aggregate proportional to its SKU count, regardless of price level. This answers <em>"on average, by how much did franchises within this brand×channel move?"</em>, treating each franchise as a unit of catalog behaviour.</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;">Formally, for a (brand, channel, week):</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;font-family:Verdana,Geneva,sans-serif;text-align:center;background:#F7F8FA;padding:8px;border-radius:4px;">
                    Δ<sub>brand, channel, t</sub> = Σ<sub>f</sub> (Δ<sub>f, t</sub> × n_SKUs<sub>f, t</sub>) / Σ<sub>f</sub> n_SKUs<sub>f, t</sub>
                </p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;">Note that this is not algebraically equivalent to recomputing Δ from a basket-level weighted-mean price series — the two converge when most volume sits on franchises moving in the same direction, and can diverge when a small franchise moves sharply against the dominant ones. Model Breakdown shows the per-franchise Δs directly (no aggregation), so it is unaffected.</p>
                <p style="font-size:11px;color:#9AA8BB;margin:0;line-height:1.6;"><strong>Coverage:</strong> Asics 93%, Adidas 85%, Olympikus 80%, Mizuno 80%, Under Armour 75%, Nike 67% (Nike has dispersed Jordan sub-models). Franchises with peak weekly n_SKUs &lt; 100 are excluded for statistical robustness — 171 franchises kept of 458 detected.</p>
            </div>

            <div>
                <p style="font-size:11px;font-weight:700;color:#021C45;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 8px 0;border-bottom:1px solid #EBEBEB;padding-bottom:6px;">Sport Category Filter</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;">Each channel uses its own naming convention, mapped to three buckets:</p>
                <ul style="font-size:12px;color:#344F75;margin:0 0 6px 0;padding-left:18px;line-height:1.9;">
                    <li><strong>Corrida</strong> — running only (Corrida / Running / Corrida·Caminhada)</li>
                    <li><strong>Performance</strong> — Corrida + Treino + Academia/Fitness + Trilha (channel-specific name variations)</li>
                    <li><strong>All</strong> — all footwear categories</li>
                </ul>
                <p style="font-size:11px;color:#9AA8BB;margin:0;line-height:1.6;">Raw category names differ by source: Direct uses VTEX/API sport names (Running, SportStyle, Treino &amp; Academia…); Netshoes uses its own taxonomy (Corrida, Treino, Trail Running, Fitness e Musculação…). Each is mapped individually in <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">SPORT_CATS</code>.</p>
            </div>

            <div>
                <p style="font-size:11px;font-weight:700;color:#021C45;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 8px 0;border-bottom:1px solid #EBEBEB;padding-bottom:6px;">Centauro Marketplace</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;">The same product (EAN = model + size) can be listed by multiple third-party sellers at different prices.</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;"><strong>Methodology:</strong> for each EAN on each date, keep only the <em>lowest available price</em>.</p>
                <p style="font-size:12px;color:#344F75;margin:0;line-height:1.7;"><strong>Rationale:</strong> measures the discount level present for each brand in the market — if a shoe is available at a discount anywhere on the site, that product is discounted.</p>
            </div>

            <div>
                <p style="font-size:11px;font-weight:700;color:#021C45;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 8px 0;border-bottom:1px solid #EBEBEB;padding-bottom:6px;">Week Convention</p>
                <ul style="font-size:12px;color:#344F75;margin:0;padding-left:18px;line-height:1.9;">
                    <li>All four chart cards use the same convention: <strong>week key = Sunday at the end of the ISO Mon–Sun week</strong> — e.g. W21 2026 = 2026-05-24 (Mon 18 May → Sun 24 May).</li>
                    <li><strong>Olympikus / Mizuno (Aster):</strong> daily collection — week aggregates all 7 days</li>
                    <li><strong>Direct (Adidas/Nike/Asics/UA):</strong> daily scraper 07:00 BRT — week aggregates all daily snapshots collected Mon–Sun</li>
                    <li><strong>Netshoes (own scraper):</strong> daily collection — week aggregates all available days</li>
                    <li><strong>Centauro (Aster):</strong> <span style="color:#C8102E;font-weight:600;">Thursday snapshot only — 1×/week</span>. The "week" datapoint for Centauro is in fact a single Thursday snapshot. When that Thursday is missed by the source, the entire week is empty (no fallback to other days).</li>
                </ul>
                <p style="font-size:11px;color:#9AA8BB;margin:8px 0 0 0;line-height:1.6;"><strong>Pipeline correction (2026-05-26):</strong> the Franchise Pass-Through pipeline previously anchored weeks to the Sunday at the <em>start</em> of a Sun–Sat span, which placed Centauro Thursday data one ISO week behind the other three cards. The pipeline was corrected on 2026-05-26 to use the Sunday at the <em>end</em> of the ISO Mon–Sun week, matching all other charts. Historical data was fully regenerated.</p>
                <p style="font-size:11px;color:#9AA8BB;margin:8px 0 0 0;line-height:1.6;"><strong>Centauro data gaps:</strong> (a) <em>structural</em> — Black Friday and any weekend event are never captured since collection is Thursday-only; (b) <em>historical</em> — no Centauro data exists in the source between 2023-10-01 and 2025-07-27 (~21 months); (c) <em>sporadic missed Thursdays</em>: 2025-09-18, 2025-10-02, 2025-10-09, 2025-10-30 (whole weeks therefore absent). Affects Asics-, Nike- and Adidas-Centauro series. Monthly aggregates ignore empty weeks rather than treating them as zero; October-2025 averages are based on only 2 weeks (16 + 23).</p>
            </div>

            <div>
                <p style="font-size:11px;font-weight:700;color:#021C45;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 8px 0;border-bottom:1px solid #EBEBEB;padding-bottom:6px;">Product Scope — Direct Channel</p>
                <p style="font-size:12px;color:#344F75;margin:0 0 6px 0;line-height:1.7;">Only <strong>footwear</strong> is tracked. Each brand's API was filtered to exclude apparel, accessories and equipment:</p>
                <ul style="font-size:12px;color:#344F75;margin:0;padding-left:18px;line-height:1.9;">
                    <li><strong>Adidas:</strong> <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">sport_pt_br</code> facet in the Search API returns footwear-dominant results by default</li>
                    <li><strong>Nike:</strong> <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">/calcados/</code> URL segment restricts to footwear category</li>
                    <li><strong>Asics:</strong> allowlist filter on VTEX sport category (Running, SportStyle, Tennis, Skateboarding, Quadra, Trilha, Vôlei, Infantil, Calçados) — excludes Camisetas, Leggings, Meias, Bolsas etc.</li>
                    <li><strong>Under Armour:</strong> VTEX category path filter <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">/Gênero/Calçados/Sport/</code> — the VTEX facet for "Calçados" is non-functional so UA returns all 2 000+ products; footwear is identified post-fetch by path depth</li>
                </ul>
                <p style="font-size:11px;color:#9AA8BB;margin:6px 0 0 0;line-height:1.6;">Historical note: before 2026-05-21 the Asics and UA scrapers lacked this filter. W20 (2026-05-17) was the first contaminated week; BQ history was cleaned and JS arrays corrected on 2026-05-21.</p>
            </div>

            <div>
                <p style="font-size:11px;font-weight:700;color:#021C45;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 8px 0;border-bottom:1px solid #EBEBEB;padding-bottom:6px;">Product Scope — Centauro, Olympikus, Mizuno (Aster)</p>
                <ul style="font-size:12px;color:#344F75;margin:0;padding-left:18px;line-height:1.9;">
                    <li><strong>Centauro:</strong> filtered to <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">grandparent_group = 'Calçados'</code>. Apparel, accessories, socks and equipment are excluded. EAN-level dedup keeps each product 1× (handles marketplace seller duplicates: Centauro-direct preferred, else lowest-price marketplace listing).</li>
                    <li><strong>Olympikus:</strong> filtered to <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">subcategory_name IN ('Calçados', 'Tênis')</code>. Model-level dedup by <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">grandparent_id</code>.</li>
                    <li><strong>Mizuno:</strong> filtered to <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">subcategory_name = 'Calçados'</code>. Model-level dedup by <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">grandparent_id</code>.</li>
                </ul>
                <p style="font-size:11px;color:#9AA8BB;margin:6px 0 0 0;line-height:1.6;">Historical note: before 2026-05-22 the Centauro queries lacked the footwear filter and were mixing footwear with apparel/accessories. Impact on the last closed week was up to <strong>+6.8 pp</strong> on Adidas % SKUs discounted (37.3% → 44.0% footwear-only). All historical Centauro weeks were re-run with the new filter on 2026-05-22; for 2022 weeks the source's <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">child_is_available</code> field was not yet populated, so the regen accepted NULL as "available" — a slightly looser definition than 2025+ data.</p>
            </div>

            <div>
                <p style="font-size:11px;font-weight:700;color:#021C45;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 8px 0;border-bottom:1px solid #EBEBEB;padding-bottom:6px;">Dedup Granularity by Channel</p>
                <ul style="font-size:12px;color:#344F75;margin:0;padding-left:18px;line-height:1.9;">
                    <li><strong>Direct (Adidas/Nike/Asics/UA):</strong> model-level (<code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">grandparent_id</code>)</li>
                    <li><strong>Netshoes:</strong> model-level (<code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">product_code</code>)</li>
                    <li><strong>Olympikus / Mizuno:</strong> model-level (<code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">grandparent_id</code>)</li>
                    <li><strong>Centauro:</strong> EAN-level (<code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">child_ean</code>) — necessary to dedup the same physical product listed by multiple marketplace sellers. Slightly more granular than other channels (sneakers with many sizes/colors weight more in the average), but a unit-comparable definition would require an additional model-level rollup the source does not currently support cleanly.</li>
                </ul>
                <p style="font-size:11px;color:#9AA8BB;margin:6px 0 0 0;line-height:1.6;">Verified 2026-05-22 that Olympikus and Mizuno give the same discount to all sizes of the same model 99.77% of the time, so <code style="font-size:10px;background:#F7F8FA;padding:1px 4px;border-radius:4px;">MAX(child_pct_discount)</code> per model is equivalent to MIN or AVG — no bias introduced by aggregating sizes into a model identifier.</p>
            </div>

        </div>
    </section>
