function fmtNumberEN(value, digits=1) {
    return Number(value || 0).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function fmtPctEN(value, digits=0) {
    if (!Number.isFinite(value)) return 'n.m.';
    const abs = Math.abs(value * 100);
    const text = `${fmtNumberEN(abs, digits)}%`;
    return value < 0 ? `(${text})` : text;
}

function fmtMetric(value) {
    return fmtNumberEN(value / 1e6, 0);
}

function fmtTooltip(value) {
    if (importsState.metric === 'fob') return `US$ ${fmtNumberEN(value / 1e6, 2)}mn`;
    return `${fmtNumberEN(value / 1e6, 2)}mn pairs`;
}

function metricValue(row) {
    return importsState.metric === 'fob' ? Number(row.fob_usd || 0) : Number(row.pairs || 0);
}

function countryNameEN(name) {
    return COUNTRY_NAME_EN[name] || name || 'Unknown';
}

function periodKey(year, month) {
    return `${year}-${String(month).padStart(2, '0')}`;
}

function parsePeriodStart(key) {
    if (!key) return null;
    if (key.includes('-Q')) {
        const [year, qPart] = key.split('-Q');
        return { year: Number(year), month: (Number(qPart) - 1) * 3 + 1 };
    }
    if (key.includes('-')) {
        const [year, month] = key.split('-');
        return { year: Number(year), month: Number(month) };
    }
    return { year: Number(key), month: 1 };
}

function parsePeriodEnd(key) {
    if (!key) return null;
    if (key.includes('-Q')) {
        const [year, qPart] = key.split('-Q');
        return { year: Number(year), month: Number(qPart) * 3 };
    }
    if (key.includes('-')) {
        const [year, month] = key.split('-');
        return { year: Number(year), month: Number(month) };
    }
    return { year: Number(key), month: 12 };
}

function periodKeyForCurrentGrain(date) {
    if (!date || !Number.isFinite(date.year) || !Number.isFinite(date.month)) return null;
    if (importsState.grain === 'monthly') return periodKey(date.year, date.month);
    if (importsState.grain === 'quarterly') return `${date.year}-Q${quarterOf(date.month)}`;
    return String(date.year);
}

function monthLabel(year, month) {
    return `${MONTH_NAMES[month - 1]}/${String(year).slice(-2)}`;
}

function quarterOf(month) {
    return Math.floor((month - 1) / 3) + 1;
}

function quarterLabel(year, quarter) {
    return `${quarter}Q${String(year).slice(-2)}`;
}

function quarterLabelFull(year, quarter) {
    return `${quarter}Q${year}`;
}

function sourceRows() {
    return (window.SPORTS_IMPORTS_DATA && window.SPORTS_IMPORTS_DATA.monthlyTotal) ? window.SPORTS_IMPORTS_DATA.monthlyTotal : [];
}

function sourceCountryRows() {
    return (window.SPORTS_IMPORTS_DATA && window.SPORTS_IMPORTS_DATA.monthlyByCountry) ? window.SPORTS_IMPORTS_DATA.monthlyByCountry : [];
}

function allMonths() {
    return sourceRows().map(row => ({
        key: periodKey(row.year, row.month),
        year: row.year,
        month: row.month,
        label: monthLabel(row.year, row.month),
        value: metricValue(row),
    })).sort((a, b) => a.key.localeCompare(b.key));
}

function monthlyLtmRows(rows) {
    const out = [];
    for (let i = 0; i < rows.length; i++) {
        if (i < 11) continue;
        const windowRows = rows.slice(i - 11, i + 1);
        out.push({ ...rows[i], value: windowRows.reduce((sum, row) => sum + row.value, 0) });
    }
    return out;
}

function aggregateQuarterly(rows, ltm=false, requireComplete=true) {
    const buckets = new Map();
    rows.forEach(row => {
        const q = quarterOf(row.month);
        const key = `${row.year}-Q${q}`;
        if (!buckets.has(key)) buckets.set(key, { key, year: row.year, quarter: q, label: quarterLabel(row.year, q), months: [], value: 0 });
        const bucket = buckets.get(key);
        bucket.months.push(row);
        bucket.value += row.value;
    });
    const quarters = [...buckets.values()]
        .filter(row => !requireComplete || new Set(row.months.map(monthRow => monthRow.month)).size === 3)
        .sort((a, b) => a.key.localeCompare(b.key));
    if (!ltm) return quarters;
    return quarters.map((q, i) => {
        const start = Math.max(0, i - 3);
        if (i < 3) return null;
        return { ...q, value: quarters.slice(start, i + 1).reduce((sum, row) => sum + row.value, 0) };
    }).filter(Boolean);
}

function aggregateAnnual(rows) {
    const buckets = new Map();
    rows.forEach(row => {
        const key = String(row.year);
        if (!buckets.has(key)) buckets.set(key, { key, year: row.year, label: key, value: 0, months: 0 });
        const bucket = buckets.get(key);
        bucket.value += row.value;
        bucket.months += 1;
    });
    return [...buckets.values()].sort((a, b) => a.key.localeCompare(b.key)).map(row => ({
        ...row,
        label: row.months < 12 ? `${row.year} YTD` : String(row.year)
    }));
}

function totalSeries() {
    const monthly = allMonths();
    if (importsState.grain === 'monthly') return importsState.base === 'ltm' ? monthlyLtmRows(monthly) : monthly;
    if (importsState.grain === 'quarterly') return aggregateQuarterly(monthly, importsState.base === 'ltm');
    return aggregateAnnual(monthly);
}

function countryMonthlyBase() {
    return sourceCountryRows().map(row => ({
        key: periodKey(row.year, row.month),
        year: row.year,
        month: row.month,
        country: countryNameEN(row.country_name || row.country_code),
        value: metricValue(row),
    })).sort((a, b) => a.key.localeCompare(b.key));
}

function countrySeriesByPeriod() {
    const monthlyRows = countryMonthlyBase();
    if (importsState.grain === 'quarterly') {
        const validQuarters = aggregateQuarterly(allMonths(), false, true);
        const spotRows = validQuarters.map(q => ({ key: q.key, label: q.label, countries: {} }));
        const byKey = new Map(spotRows.map(row => [row.key, row]));
        monthlyRows.forEach(row => {
            const q = quarterOf(row.month);
            const key = `${row.year}-Q${q}`;
            const bucket = byKey.get(key);
            if (!bucket) return;
            bucket.countries[row.country] = (bucket.countries[row.country] || 0) + row.value;
        });
        if (importsState.base !== 'ltm') return spotRows;
        return spotRows.map((row, i) => {
            if (i < 3) return null;
            const countries = {};
            spotRows.slice(i - 3, i + 1).forEach(qRow => {
                Object.entries(qRow.countries).forEach(([country, value]) => {
                    countries[country] = (countries[country] || 0) + value;
                });
            });
            return { ...row, countries };
        }).filter(Boolean);
    }

    const countries = [...new Set(monthlyRows.map(row => row.country))].sort();
    const out = new Map();

    countries.forEach(country => {
        const rows = monthlyRows.filter(row => row.country === country);
        let series;
        if (importsState.grain === 'monthly') {
            const monthly = rows.map(row => ({ key: row.key, year: row.year, month: row.month, label: monthLabel(row.year, row.month), country, value: row.value }));
            series = importsState.base === 'ltm' ? monthlyLtmRows(monthly) : monthly;
        } else {
            const monthly = rows.map(row => ({ key: row.key, year: row.year, month: row.month, label: monthLabel(row.year, row.month), country, value: row.value }));
            series = aggregateAnnual(monthly).map(row => ({ ...row, country }));
        }
        series.forEach(row => {
            if (!out.has(row.key)) out.set(row.key, { key: row.key, label: row.label, countries: {} });
            out.get(row.key).countries[country] = row.value;
        });
    });
    return [...out.values()].sort((a, b) => a.key.localeCompare(b.key));
}

function ensureRange() {
    if (importsState.grain === 'annual') importsState.base = 'spot';
    const rows = totalSeries();
    if (!rows.length) return;
    const keys = rows.map(row => row.key);
    if (!importsState.from || !keys.includes(importsState.from)) importsState.from = keys[0];
    if (!importsState.to || !keys.includes(importsState.to)) importsState.to = keys[keys.length - 1];
    if (importsState.from > importsState.to) [importsState.from, importsState.to] = [importsState.to, importsState.from];
}

function filteredTotalSeries() {
    ensureRange();
    return totalSeries().filter(row => row.key >= importsState.from && row.key <= importsState.to);
}

function filteredCountryPeriods() {
    ensureRange();
    const rows = countrySeriesByPeriod().filter(row => row.key >= importsState.from && row.key <= importsState.to);
    if (importsState.grain !== 'quarterly') return rows;
    const validKeys = new Set(totalSeries().map(row => row.key));
    return rows.filter(row => validKeys.has(row.key));
}

function tableMetricValue(row, metric) {
    return metric === 'fob' ? Number(row.fob_usd || 0) : Number(row.pairs || 0);
}

function allMonthsForMetric(metric) {
    return sourceRows().map(row => ({
        key: periodKey(row.year, row.month),
        year: row.year,
        month: row.month,
        label: monthLabel(row.year, row.month),
        value: tableMetricValue(row, metric),
    })).sort((a, b) => a.key.localeCompare(b.key));
}

function periodSeriesForMetric(metric, state) {
    const monthly = allMonthsForMetric(metric);
    if (state.grain === 'monthly') return state.base === 'ltm' ? monthlyLtmRows(monthly) : monthly;
    if (state.grain === 'quarterly') return aggregateQuarterly(monthly, state.base === 'ltm');
    return aggregateAnnual(monthly);
}

function tablePeriodOptions() {
    if (importsTableState.grain === 'annual') importsTableState.base = 'spot';
    return periodSeriesForMetric('volume', importsTableState);
}

function ensureTableRange() {
    if (importsTableState.grain === 'annual') importsTableState.base = 'spot';
    const rows = tablePeriodOptions();
    if (!rows.length) return;
    const keys = rows.map(row => row.key);
    if (!importsTableState.from || !keys.includes(importsTableState.from)) importsTableState.from = keys[0];
    if (!importsTableState.to || !keys.includes(importsTableState.to)) importsTableState.to = keys[keys.length - 1];
    if (keys.indexOf(importsTableState.from) > keys.indexOf(importsTableState.to)) [importsTableState.from, importsTableState.to] = [importsTableState.to, importsTableState.from];
}

function importsTableRowsForMetric(metric) {
    ensureTableRange();
    const rows = periodSeriesForMetric(metric, importsTableState);
    const byKey = new Map(rows.map(row => [row.key, row]));
    const selected = rows.filter(row => row.key >= importsTableState.from && row.key <= importsTableState.to);
    return selected.map((row, idx) => {
        let yoyKey = null;
        if (importsTableState.grain === 'monthly') yoyKey = periodKey(row.year - 1, row.month);
        else if (importsTableState.grain === 'quarterly') yoyKey = `${row.year - 1}-Q${row.quarter}`;
        else yoyKey = String(row.year - 1);
        const yoyBase = byKey.get(yoyKey);
        const rowPos = rows.findIndex(item => item.key === row.key);
        const prev = rowPos > 0 ? rows[rowPos - 1] : null;
        const canAnnualYoy = importsTableState.grain !== 'annual' || (row.months === 12 && yoyBase?.months === 12);
        const yoy = canAnnualYoy && yoyBase && yoyBase.value ? row.value / yoyBase.value - 1 : null;
        const pop = prev && prev.value ? row.value / prev.value - 1 : null;
        return { ...row, displayIndex: idx, yoy, pop };
    });
}

function labelIndices(rows) {

        return rows.map((row, i) => row.month === latestMonth ? i : -1).filter(i => i >= 0);
    }
    if (importsState.grain === 'quarterly') {
        const latestQuarter = rows[rows.length - 1]?.quarter;
        return rows.map((row, i) => row.quarter === latestQuarter ? i : -1).filter(i => i >= 0);
    }
    return rows.map((_, i) => i);
}

function roundedRect(ctx, x, y, w, h, r) {
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); return; }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
}

function tightAxis(values, forceZeroMin=false) {
    const valid = values.filter(Number.isFinite);
    if (!valid.length) return { min: 0, max: 1 };
    const min = forceZeroMin ? 0 : Math.min(...valid);
    const max = Math.max(...valid);
    const pad = Math.max((max - min) * 0.12, max * 0.04, 1);
    return { min: Math.max(0, min - pad), max: max + pad };
}

function industryRevisionMatrix() {
    const rows = industryData().reportSeries || [];
    const dataYears = [...new Set(rows.map(row => row.data_year))].sort((a, b) => a - b);
    const reportYears = [...new Set(rows.map(row => row.report_year))].sort((a, b) => a - b);
    return dataYears.map(year => {
        const byReport = {};
        rows.filter(row => row.data_year === year).forEach(row => { byReport[row.report_year] = row; });
        const versions = reportYears.map(reportYear => byReport[reportYear]).filter(Boolean);
        const first = versions[0];
        const last = versions[versions.length - 1];
        return { data_year: year, byReport, first, last, delta: first && last ? last.apparent_consumption_mn - first.apparent_consumption_mn : null };
    });
}

function yoyFromIndustry(row, idx, rows) {
    if (!idx || !rows[idx - 1]?.apparent_consumption_mn) return null;

function yoyForIndustryMetric(row, metric) {
    const prior = sectorRows().find(item => item.data_year === row.data_year - 1);
    const priorValue = Number(prior?.[metric]);
    const value = Number(row?.[metric]);
    return priorValue ? value / priorValue - 1 : null;
}

function sectorCagr(rows, metric) {
    if (rows.length < 2) return null;
    const first = rows[0];
    const last = rows[rows.length - 1];
    const firstValue = Number(first?.[metric]);
    const lastValue = Number(last?.[metric]);
    const years = Number(last?.data_year) - Number(first?.data_year);
    if (!firstValue || !lastValue || years <= 0) return null;
    return Math.pow(lastValue / firstValue, 1 / years) - 1;
}

function sectorPctCell(value, style='') {
    const finite = Number.isFinite(value);
    const color = !finite ? C.azulEscuro40 : value < 0 ? '#B0002A' : '#00857D';
    return `<td style="color:${color};font-weight:400;${style}">${finite ? fmtPctEN(value, 0) : 'n.m.'}</td>`;
}

function sectorBreakdownMainRow(label, metric, rows, apparent=false) {

        ${rows.map(row => `<td style="font-weight:800;">${fmtNumberEN(row[metric], 1)}</td>`).join('')}
        <td class="cagr-cell" style="color:${Number.isFinite(cagr) && cagr < 0 ? '#B0002A' : C.azulEscuro};">${Number.isFinite(cagr) ? fmtPctEN(cagr, 0) : 'n.m.'}</td>

function vulcabrasAnnualVolumeRows() {
    const annualRows = window.VULCABRAS_VOLUME_DATA?.annualRows || [];
    if (annualRows.length) {
        return annualRows.map(row => ({
            year: Number(row.year),
            quarters: 4,
            volumeMn: Number(row.athletic_footwear_volume_k_pairs) / 1000,
        })).filter(row => Number.isFinite(row.year) && Number.isFinite(row.volumeMn))
            .sort((a, b) => a.year - b.year);
    }
    const groups = new Map();
    vulcabrasVolumeRows().forEach(row => {
        if (!groups.has(row.year)) groups.set(row.year, { year: row.year, quarters: 0, volumeMn: 0 });
        const item = groups.get(row.year);
        item.quarters += 1;
        item.volumeMn += row.value / 1000;
    });
    return Array.from(groups.values())
        .filter(row => row.quarters === 4)
        .sort((a, b) => a.year - b.year);
}

function vulcabrasMarketShareRows() {
    const abicalByYear = new Map(sectorRows().map(row => [Number(row.data_year), row]));

        return {
            year: row.year,

            vulcabrasVolumeMn: row.volumeMn,
            abicalVolumeMn: abicalVolume,
            share: abicalVolume ? row.volumeMn / abicalVolume : null,

        it.classList.toggle('is-hidden', !chart.isDatasetVisible(Number(it.dataset.datasetIndex)));
    });
    document.querySelectorAll('#tam-chart-card .chart-legend-item[data-dataset-index]').forEach(item => {
        const toggle = () => {
            const idx = Number(item.dataset.datasetIndex);
            chart.setDatasetVisibility(idx, !chart.isDatasetVisible(idx));
            chart.update();
            sync();
        };
        item.addEventListener('click', toggle);
        item.addEventListener('keydown', event => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            toggle();
        });
    });
    sync();
}

    const tamYoyFull = years.map((_, i) => (i === 0 || !totalMn[i - 1]) ? null : (totalMn[i] / totalMn[i - 1] - 1) * 100);
    const tamYoy = tamYoyFull.slice(fromIndex, toIndex + 1); if (fromIndex > 0) tamYoy[0] = null;
    const tamCagrV = tamCagrCalc(totalMn[fromIndex], totalMn[toIndex], toIndex - fromIndex);

const VULCABRAS_SHARE_STATE = { frequency: 'annual', from: 2016, to: 2025 };

const MS_BRAND_GMV_TABLE_STATE = { brand: 'Vulcabras', from: 2016, to: 2025 };

let marketShareBrandGmvChart = null;

function msData() { return window.SPORTSWEAR_BRAND_SHARES || { years: [], totals: {}, brands: {} }; }

function msDenominatorSeries(category, basis) {
    const d = msData();
    const years = d.years || [];
    const brands = d.brands[category] || {};
    if (basis === 'named') {
        return years.map((_, index) => Object.values(brands).reduce((sum, values) => sum + (Number.isFinite(values?.[index]) ? Number(values[index]) : 0), 0));
    }
    return (d.totals[category] || []).map(value => Number(value || 0));
}

function getMarketShareModel() {
    // RECEITA ÚNICA — modelo calculado pelo charts-registry.js (mesma fn que o PPT usa)
    return window.computeMarketShareModel({
        category: MS_STATE.category,
        vulcabras: MS_STATE.vulcabras,
        basis: MS_STATE.shareBasis,
        from: MS_STATE.from,
        to: MS_STATE.to
    }, msData());
}

function msFmtPct(value, digits = 1) {
    if (!Number.isFinite(value)) return 'n.a.';
    const rounded = Number(value.toFixed(digits));
    return `${rounded.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits })}%`;
}

function msFmtPp(value, digits = 1) {
    if (!Number.isFinite(value)) return 'n.a.';
    const rounded = Number(value.toFixed(digits));
    return `${rounded > 0 ? '+' : ''}${rounded.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits })}pp`;
}

function msYoySeries(values) {
    return values.map((value, index) => index === 0 || !Number.isFinite(values[index - 1]) || values[index - 1] === 0 ? null : ((value / values[index - 1]) - 1) * 100);
}

function msCagr(startValue, endValue, periods) {
    if (!Number.isFinite(startValue) || !Number.isFinite(endValue) || startValue <= 0 || endValue <= 0 || periods <= 0) return null;
    return (Math.pow(endValue / startValue, 1 / periods) - 1) * 100;
}

function msYoyHeatText(value) {
    if (!Number.isFinite(value)) return `<span class="breakdown-yoy-heat" style="color:${C.azulEscuro};">n.a.</span>`;
    const rounded = Number(value.toFixed(1));
    const color = rounded < 0 ? '#8F1028' : rounded > 0 ? '#007A68' : C.azulEscuro;
    return `<span class="breakdown-yoy-heat" style="color:${color};">${msFmtPct(rounded, 1)}</span>`;
}

    const vulcOpts = `<option value="separate" ${MS_STATE.vulcabras === 'separate' ? 'selected' : ''}>Separate</option><option value="combined" ${MS_STATE.vulcabras === 'combined' ? 'selected' : ''}>Combined</option>`;
    const basisOpts = `<option value="reported" ${MS_STATE.shareBasis === 'reported' ? 'selected' : ''}>Euromonitor</option><option value="named" ${MS_STATE.shareBasis === 'named' ? 'selected' : ''}>Named Players</option>`;

function msAllBrandNames() {
    const brands = msData().brands || {};
    return Array.from(new Set([
        ...Object.keys(brands.total || {}),
        ...Object.keys(brands.apparel || {}),
        ...Object.keys(brands.footwear || {})
    ])).sort((a, b) => a.localeCompare(b));
}

function msBrandMembers(brand) {
    return brand === 'Vulcabras' ? MS_VULCABRAS : [brand];
}

function msBrandCategorySeries(category, brand) {
    const d = msData();
    const categoryBrands = d.brands?.[category] || {};
    const members = msBrandMembers(brand);
    return (d.years || []).map((_, index) => members.reduce((sum, member) => {
        const value = categoryBrands[member]?.[index];
        return sum + (Number.isFinite(value) ? Number(value) : 0);
    }, 0));
}

    if (toIndex < 0) toIndex = years.length - 1;
    if (fromIndex > toIndex) [fromIndex, toIndex] = [toIndex, fromIndex];
    const shown = years.slice(fromIndex, toIndex + 1);
    const ftMn = msBrandCategorySeries('footwear', MS_BRAND_GMV_TABLE_STATE.brand);
    const apMn = msBrandCategorySeries('apparel', MS_BRAND_GMV_TABLE_STATE.brand);
    const totalMn = years.map((_, i) => ftMn[i] + apMn[i]);
    const totalValBn = shown.map((_, i) => totalMn[fromIndex + i] / 1000);
    const totalYoyFull = msYoySeries(totalMn);
    const totalYoy = totalYoyFull.slice(fromIndex, toIndex + 1);

            ${shown.map((y, i) => `<th style="background:#082654;color:#FFFFFF;font-size:12.5px;font-weight:700;padding:14px 10px;text-align:center;white-space:nowrap;${i === shown.length - 1 ? 'border-radius:0 6px 0 0;' : ''}">${y}</th>`).join('')}

function marketShareTableInner() {
    const model = getMarketShareModel();
    if (!model) return '';
    const d = msData();
    const denominator = msDenominatorSeries(MS_STATE.category, MS_STATE.shareBasis);
    const totalSeries = model.years.map(year => {
        const idx = (d.years || []).indexOf(year);
        return idx >= 0 ? Number(denominator[idx] || 0) : 0;
    });
    const totalYoy = msYoySeries(totalSeries);
    const rows = model.series.map(series => {
        const values = series.data.map((share, idx) => totalSeries[idx] * share / 100);
        return { ...series, values, yoy: msYoySeries(values), shares: series.data };
    });
    const side = (values, shares, isTotal = false) => {
        const cagrValue = msCagr(values[0], values[values.length - 1], values.length - 1);
        const deltaPp = shares && shares.length ? shares[shares.length - 1] - shares[0] : null;
        return {
            cagrText: cagrValue == null ? 'n.a.' : msFmtPct(cagrValue, 1),
            varText: isTotal || deltaPp == null ? null : msFmtPp(deltaPp, 1),
            varClass: deltaPp > 0 ? 'pos' : deltaPp < 0 ? 'neg' : 'neu'
        };
    };
    const sideCell = sideInfo => `<td class="breakdown-side-cell">
        <div class="breakdown-cell-main">${sideInfo.cagrText}</div>
        <div class="breakdown-cell-sub breakdown-sidebox-empty">-</div>
        ${sideInfo.varText ? `<div class="breakdown-cell-sub"><span class="breakdown-sidebox-pp ${sideInfo.varClass}">${sideInfo.varText}</span></div>` : `<div class="breakdown-cell-sub breakdown-sidebox-empty">-</div>`}
    </td>`;
    const yearHeads = model.years.map(year => `<th class="breakdown-year-head">${year}</th>`).join('');
    const totalCells = totalSeries.map((value, idx) => `<td class="breakdown-year-cell">
        <div class="breakdown-total-band"><div class="breakdown-cell-main">${fmtNumberEN(value / 1000, 1)}</div></div>
        <div class="breakdown-cell-sub">${msYoyHeatText(totalYoy[idx])}</div>
    </td>`).join('');
    const rowHtml = rows.map((row, rowIdx) => `<tr class="breakdown-brand-row">
        <td class="breakdown-sticky">
            <div class="breakdown-row-title">${rowIdx + 1}. ${row.label}</div>
            <div class="breakdown-row-sub">YoY (%)</div>
            <div class="breakdown-row-sub">Market Share</div>
        </td>
        ${row.values.map((value, idx) => `<td class="breakdown-year-cell">
            <div class="breakdown-cell-main">${fmtNumberEN(value / 1000, 1)}</div>
            <div class="breakdown-cell-sub">${msYoyHeatText(row.yoy[idx])}</div>
            <div class="breakdown-cell-sub">${msFmtPct(row.shares[idx], 1)}</div>
        </td>`).join('')}
        <td class="breakdown-gap-cell"></td>
        ${sideCell(side(row.values, row.shares))}
    </tr>`).join('');
    const header = `<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;width:100%;margin-bottom:16px;">
        <div><h3 style="color:${C.azulEscuro};font-size:15px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;margin:0 0 4px 0;">GMV Breakdown by Brand</h3>
        <p style="color:${C.azulEscuro60};font-size:12px;margin:0;">(BRL bn, Percentage)</p></div>
        ${marketShareControlsHtml('ms-table')}</div>`;
    return `${header}<div class="breakdown-scroll"><table class="breakdown-table">
        <thead><tr><th class="breakdown-sticky"></th>${yearHeads}<th class="breakdown-gap-head"></th><th class="breakdown-side-head">CAGR or Var</th></tr></thead>
        <tbody>
            <tr class="breakdown-total-row">
                <td class="breakdown-sticky"><div class="breakdown-total-label-band"><div class="breakdown-row-title">${MS_STATE.shareBasis === 'named' ? 'Adjusted GMV' : 'GMV'}</div></div><div class="breakdown-total-yoy-label">YoY (%)</div></td>
                ${totalCells}
                <td class="breakdown-gap-cell"></td>
                ${sideCell(side(totalSeries, null, true))}
            </tr>
            ${rowHtml}
        </tbody>
    </table></div>`;
}

function bindMarketShareLegend(chart) {
    if (!chart) return;

function heatColorCG(v) {
    if (v === null || Number.isNaN(v)) return "#FFFFFF";
    if (v < 0) return "#FFFFFF";
    if (v < 2) return "#F7FBF9";
    if (v < 6) return "#DDEFE7";
    if (v < 10) return "#C4E8D4";
    if (v < 15) return "#A6DDBF";
    if (v < 20) return "#86D2A9";
    if (v < 25) return "#63C991";
    return "#49BE7F";
}
function formatMetricPercentCG(v) {
    if (v === null || Number.isNaN(v)) return "-";
    const t = `${Math.abs(v).toFixed(0)}%`;
    return v < 0 ? `(${t})` : t;
}

        const ruleBot = sub && (idx === COMPANIES_GROWTH_ROWS.length - 1 || COMPANIES_GROWTH_ROWS[idx + 1].type !== 'sub'); // última sub-linha
        const rb = (ruleTop ? `border-top:${grayLine};` : '') + (ruleBot ? `border-bottom:${grayLine};` : '');
        const spacer = (!sub && idx > 0) ? `<tr><td colspan="${n + 1}" style="height:12px;border:0;padding:0;"></td></tr>` : '';  // gap antes de cada grupo
        const lbl = `<td style="text-align:left;padding:${pad};color:${navy};font-weight:${fw};${sub ? 'padding-left:26px;' : ''}${rb}">${row.label}</td>`;
        const cells = cols.map((p, ci) => {

    }).join('');
    return `<div style="overflow-x:auto;"><table style="border-collapse:collapse;width:100%;font-size:12px;"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function cagedSourceRows() {
    const _d = cagedActiveData();
    const rows = (_d && _d.rows) ? _d.rows : [];
    const region = cagedRegion || 'all';
    const segment = cagedSegment || 'footwear';
    const isSeg = Array.isArray(_d.municipalities);  // formato Dass (segmentado)
    // Recomputa o Total por período somando os municípios do segmento + região escolhidos.
    const byPeriod = new Map();
    rows.forEach(row => {
        if (isSeg) {
            if (segment !== 'both' && row.segment !== segment) return;
            if (!cagedRegionMatch(row.scope, region)) return;
        } else if (region === 'all') {
            if (row.scope !== 'Total') return;            // Vulcabras: usa o Total pré-computado
        } else {
            if (row.scope === 'Total' || !cagedRegionMatch(row.scope, region)) return;
        }
        const k = periodKey(row.year, row.month);
        let t = byPeriod.get(k);
        if (!t) { t = { key: k, year: Number(row.year), month: Number(row.month), label: monthLabel(Number(row.year), Number(row.month)), admissions: 0, separations: 0, net: 0 }; byPeriod.set(k, t); }
        t.admissions += Number(row.admissions || 0); t.separations += Number(row.separations || 0); t.net += Number(row.net || 0);
    });
    return [...byPeriod.values()].sort((a, b) => a.key.localeCompare(b.key));
}

function cagedSumRows(rows, template) {
    const admissions = rows.reduce((sum, row) => sum + row.admissions, 0);
    const separations = rows.reduce((sum, row) => sum + row.separations, 0);
    return { ...template, admissions, separations, net: admissions - separations };
}

function cagedMonthlyRows() {
    const rows = cagedSourceRows();
    if (cagedState.base !== 'ltm' || cagedState.grain === 'annual') return rows;
    const out = [];
    for (let i = 11; i < rows.length; i++) {
        const windowRows = rows.slice(i - 11, i + 1);
        out.push(cagedSumRows(windowRows, rows[i]));
    }
    return out;
}

function cagedQuarterlyRows() {
    const rows = cagedSourceRows();
    const groups = new Map();
    rows.forEach(row => {
        const q = quarterOf(row.month);
        const key = `${row.year}-Q${q}`;
        if (!groups.has(key)) groups.set(key, { key, year: row.year, quarter: q, label: quarterLabel(row.year, q), rows: [] });
        groups.get(key).rows.push(row);
    });
    let quarters = Array.from(groups.values())
        .filter(group => group.rows.length === 3)
        .sort((a, b) => a.key.localeCompare(b.key))
        .map(group => cagedSumRows(group.rows, { key: group.key, year: group.year, quarter: group.quarter, label: group.label }));
    if (cagedState.base !== 'ltm') return quarters;
    const out = [];
    for (let i = 3; i < quarters.length; i++) {
        const windowRows = quarters.slice(i - 3, i + 1);
        out.push(cagedSumRows(windowRows, quarters[i]));
    }
    return out;
}

function cagedAnnualRows() {
    const rows = cagedSourceRows();
    const groups = new Map();
    rows.forEach(row => {
        const key = String(row.year);
        if (!groups.has(key)) groups.set(key, { key, year: row.year, label: key, rows: [] });
        groups.get(key).rows.push(row);
    });
    return Array.from(groups.values())
        .filter(group => group.rows.length === 12)
        .sort((a, b) => a.key.localeCompare(b.key))
        .map(group => cagedSumRows(group.rows, { key: group.key, year: group.year, label: group.label }));
}

function cagedPeriodRows() {
    if (cagedState.grain === 'quarterly') return cagedQuarterlyRows();
    if (cagedState.grain === 'annual') return cagedAnnualRows();
    return cagedMonthlyRows();
}

function cagedPeriodKeyForCurrentGrain(date) {
    if (!date || !Number.isFinite(date.year) || !Number.isFinite(date.month)) return null;
    if (cagedState.grain === 'monthly') return periodKey(date.year, date.month);
    if (cagedState.grain === 'quarterly') return `${date.year}-Q${quarterOf(date.month)}`;
    return String(date.year);
}

function ensureCagedRange() {
    if (cagedState.grain === 'annual') cagedState.base = 'spot';
    const rows = cagedPeriodRows();
    if (!rows.length) return;
    const keys = rows.map(row => row.key);
    if (!cagedState.from || !keys.includes(cagedState.from)) cagedState.from = keys[Math.max(0, keys.length - 24)];
    if (!cagedState.to || !keys.includes(cagedState.to)) cagedState.to = keys[keys.length - 1];
    if (keys.indexOf(cagedState.from) > keys.indexOf(cagedState.to)) [cagedState.from, cagedState.to] = [cagedState.to, cagedState.from];
}

function cagedSelectedRows() {
    ensureCagedRange();
    return cagedPeriodRows().filter(row => row.key >= cagedState.from && row.key <= cagedState.to);
}

function cagedJobsMonthlyRows() {
    let jobs = cagedActiveBase();
    const monthly = cagedSourceRows().map(row => {
        jobs += row.net;
        return { key: row.key, year: row.year, month: row.month, label: row.label, value: jobs };
    });
    const byKey = new Map(monthly.map(row => [row.key, row]));
    return monthly.map(row => {
        const prev = byKey.get(periodKey(row.year - 1, row.month));
        return {
            ...row,
            yoy: prev && prev.value ? (row.value / prev.value - 1) * 100 : null
        };
    });
}

function cagedJobsAverage(rows, template) {
    const value = rows.reduce((sum, row) => sum + row.value, 0) / rows.length;
    return { ...template, value };
}

function cagedJobsQuarterlyRows() {
    const groups = new Map();
    cagedJobsMonthlyRows().forEach(row => {
        const q = quarterOf(row.month);
        const key = `${row.year}-Q${q}`;
        if (!groups.has(key)) groups.set(key, { key, year: row.year, quarter: q, label: quarterLabel(row.year, q), rows: [] });
        groups.get(key).rows.push(row);
    });
    const quarters = Array.from(groups.values())
        .filter(group => group.rows.length === 3)
        .sort((a, b) => a.key.localeCompare(b.key))
        .map(group => cagedJobsAverage(group.rows, { key: group.key, year: group.year, quarter: group.quarter, label: group.label }));
    const byKey = new Map(quarters.map(row => [row.key, row]));
    return quarters.map(row => {
        const prev = byKey.get(`${row.year - 1}-Q${row.quarter}`);
        return { ...row, yoy: prev && prev.value ? (row.value / prev.value - 1) * 100 : null };
    });
}

function cagedJobsAnnualRows() {
    const groups = new Map();
    cagedJobsMonthlyRows().forEach(row => {
        const key = String(row.year);
        if (!groups.has(key)) groups.set(key, { key, year: row.year, label: key, rows: [] });
        groups.get(key).rows.push(row);
    });
    const years = Array.from(groups.values())
        .filter(group => group.rows.length === 12)
        .sort((a, b) => a.key.localeCompare(b.key))
        .map(group => cagedJobsAverage(group.rows, { key: group.key, year: group.year, label: group.label }));
    const byKey = new Map(years.map(row => [row.key, row]));
    return years.map(row => {
        const prev = byKey.get(String(row.year - 1));
        return { ...row, yoy: prev && prev.value ? (row.value / prev.value - 1) * 100 : null };
    });
}

function cagedJobsPeriodRows() {
    if (cagedJobsState.grain === 'quarterly') return cagedJobsQuarterlyRows();
    if (cagedJobsState.grain === 'annual') return cagedJobsAnnualRows();
    return cagedJobsMonthlyRows();

function cagedJobsRowsForGrain(grain) {
    if (grain === 'quarterly') return cagedJobsQuarterlyRows();
    if (grain === 'annual') return cagedJobsAnnualRows();
    return cagedJobsMonthlyRows();
}

function cagedJobsPeriodKeyForCurrentGrain(date) {
    if (!date || !Number.isFinite(date.year) || !Number.isFinite(date.month)) return null;
    if (cagedJobsState.grain === 'monthly') return periodKey(date.year, date.month);
    if (cagedJobsState.grain === 'quarterly') return `${date.year}-Q${quarterOf(date.month)}`;
    return String(date.year);
}

function ensureCagedJobsRange() {

    if (!cagedJobsState.to || !keys.includes(cagedJobsState.to)) cagedJobsState.to = keys[keys.length - 1];
    if (keys.indexOf(cagedJobsState.from) > keys.indexOf(cagedJobsState.to)) [cagedJobsState.from, cagedJobsState.to] = [cagedJobsState.to, cagedJobsState.from];
}

function cagedJobsTableLookup() {
    return new Map(cagedJobsRowsForGrain(cagedJobsTableState.grain).map(row => [row.key, row]));
}

function cagedJobsPreviousKey(row, type) {
    if (type === 'yoy') {
        if (cagedJobsTableState.grain === 'monthly') return periodKey(row.year - 1, row.month);
        if (cagedJobsTableState.grain === 'quarterly') return `${row.year - 1}-Q${row.quarter}`;
        return String(row.year - 1);
    }
    if (type === 'mom') {
        if (cagedJobsTableState.grain !== 'monthly') return null;
        const prevMonth = row.month === 1 ? 12 : row.month - 1;
        const prevYear = row.month === 1 ? row.year - 1 : row.year;
        return periodKey(prevYear, prevMonth);
    }
    if (type === 'qoq') {
        if (cagedJobsTableState.grain === 'monthly') {
            const date = new Date(row.year, row.month - 4, 1);
            return periodKey(date.getFullYear(), date.getMonth() + 1);
        }
        if (cagedJobsTableState.grain === 'quarterly') {
            const prevQuarter = row.quarter === 1 ? 4 : row.quarter - 1;
            const prevYear = row.quarter === 1 ? row.year - 1 : row.year;
            return `${prevYear}-Q${prevQuarter}`;
        }
    }
    return null;
}

function cagedJobsTableVariation(row, type, lookup) {
    const prevKey = cagedJobsPreviousKey(row, type);
    const prev = prevKey ? lookup.get(prevKey) : null;
    const value = Number(row?.value);
    const prevValue = Number(prev?.value);
    return prevValue ? (value / prevValue - 1) : null;
}

function cagedJobsTableCagr(rows) {
    if (rows.length < 2) return null;
    const first = rows[0];
    const last = rows[rows.length - 1];
    const firstValue = Number(first?.value);
    const lastValue = Number(last?.value);
    if (!firstValue || !lastValue) return null;
    let years = Number(last.year) - Number(first.year);
    if (cagedJobsTableState.grain === 'monthly') years += (Number(last.month) - Number(first.month)) / 12;
    if (cagedJobsTableState.grain === 'quarterly') years += (Number(last.quarter) - Number(first.quarter)) / 4;
    if (!(years > 0)) return null;
    return Math.pow(lastValue / firstValue, 1 / years) - 1;
}

function renderCagedJobsTable() {
    const rows = cagedJobsTableRows();

    const variationRows = [

    return `<div class="imports-table-scroll" style="margin-top:18px;">

                </tr>

}

function vulcabrasVolumeRows() {
    return (window.VULCABRAS_VOLUME_DATA?.rows || [])
        .map(row => ({
            key: row.key,
            label: row.label,
            year: Number(row.year),
            quarter: Number(row.quarter),
            value: Number(row.athletic_footwear_volume_k_pairs)
        }))
        .filter(row => row.key && Number.isFinite(row.value))
        .sort((a, b) => a.key.localeCompare(b.key));
}

function quarterKeyParts(key) {
    const match = String(key || '').match(/^(\d{4})-Q([1-4])$/);
    if (!match) return null;
    return { year: Number(match[1]), quarter: Number(match[2]) };
}

function addQuarterKey(year, quarter, quartersForward=0) {
    const d = new Date(year, (quarter - 1) * 3 + Number(quartersForward || 0) * 3, 1);
    return `${d.getFullYear()}-Q${quarterOf(d.getMonth() + 1)}`;
}

function cagedVolumeYoyQuarterlyRows() {
    const jobsRows = cagedJobsQuarterlyRows();
    const volumeRows = vulcabrasVolumeRows();
    const volumeByKey = new Map(volumeRows.map(row => [row.key, row]));
    const volumeYoyByKey = new Map();
    volumeRows.filter(row => row.key >= '2021-Q1' && row.key <= '2026-Q1').forEach(row => {
        const prevVolume = volumeByKey.get(`${row.year - 1}-Q${row.quarter}`);
        volumeYoyByKey.set(row.key, prevVolume?.value ? (row.value / prevVolume.value - 1) * 100 : null);
    });
    const jobsYoyByDisplayKey = new Map();
    jobsRows.filter(row => row.key >= '2021-Q1' && Number.isFinite(row.yoy)).forEach(row => {
        jobsYoyByDisplayKey.set(addQuarterKey(row.year, row.quarter, cagedVolumeYoyState.shiftQuarters), row.yoy);
    });
    const keys = Array.from(new Set([...volumeYoyByKey.keys(), ...jobsYoyByDisplayKey.keys()]))
        .filter(key => key >= '2021-Q1')
        .sort((a, b) => a.localeCompare(b));
    return keys.map(key => {
        const parts = quarterKeyParts(key);
        return {
            key,
            label: quarterLabel(parts.year, parts.quarter),
            year: parts.year,
            quarter: parts.quarter,
            jobsYoy: jobsYoyByDisplayKey.has(key) ? jobsYoyByDisplayKey.get(key) : null,
            volumeYoy: volumeYoyByKey.has(key) ? volumeYoyByKey.get(key) : null
        };
    });
}

function cagedVolumeYoyLtmRows() {
    const jobsRows = cagedJobsQuarterlyRows();
    const volumeRows = vulcabrasVolumeRows();
    const jobsByKey = new Map(jobsRows.map(row => [row.key, row]));
    const volumeByKey = new Map(volumeRows.map(row => [row.key, row]));
    const windowKeys = row => {
        const keys = [];
        for (let i = 3; i >= 0; i--) {
            const d = new Date(row.year, (row.quarter - 1) * 3 - i * 3, 1);
            keys.push(`${d.getFullYear()}-Q${quarterOf(d.getMonth() + 1)}`);
        }
        return keys;
    };
    const priorYearKeys = keys => keys.map(key => {
        const [year, q] = key.split('-Q');
        return `${Number(year) - 1}-Q${q}`;
    });
    const volumeYoyByKey = new Map();
    volumeRows.filter(row => row.key >= '2021-Q1' && row.key <= '2026-Q1').forEach(row => {
        const quarterKeys = windowKeys(row);
        const prevKeys = priorYearKeys(quarterKeys);
        const volumeWindow = quarterKeys.map(key => volumeByKey.get(key)).filter(Boolean);
        const prevVolumeWindow = prevKeys.map(key => volumeByKey.get(key)).filter(Boolean);
        const volumeValue = volumeWindow.length === 4 ? volumeWindow.reduce((sum, item) => sum + item.value, 0) : null;
        const prevVolumeValue = prevVolumeWindow.length === 4 ? prevVolumeWindow.reduce((sum, item) => sum + item.value, 0) : null;
        volumeYoyByKey.set(row.key, prevVolumeValue ? (volumeValue / prevVolumeValue - 1) * 100 : null);
    });
    const jobsYoyByDisplayKey = new Map();
    jobsRows.filter(row => row.key >= '2021-Q1').forEach(row => {
        const jobQuarterKeys = windowKeys(row);
        const prevJobKeys = priorYearKeys(jobQuarterKeys);
        const jobsWindow = jobQuarterKeys.map(key => jobsByKey.get(key)).filter(Boolean);
        const prevJobsWindow = prevJobKeys.map(key => jobsByKey.get(key)).filter(Boolean);
        const jobsValue = jobsWindow.length === 4 ? jobsWindow.reduce((sum, item) => sum + item.value, 0) / 4 : null;
        const prevJobsValue = prevJobsWindow.length === 4 ? prevJobsWindow.reduce((sum, item) => sum + item.value, 0) / 4 : null;
        if (!prevJobsValue) return;
        jobsYoyByDisplayKey.set(addQuarterKey(row.year, row.quarter, cagedVolumeYoyState.shiftQuarters), (jobsValue / prevJobsValue - 1) * 100);
    });
    const keys = Array.from(new Set([...volumeYoyByKey.keys(), ...jobsYoyByDisplayKey.keys()]))
        .filter(key => key >= '2021-Q1')
        .sort((a, b) => a.localeCompare(b));
    return keys.map(key => {
        const parts = quarterKeyParts(key);
        return {
            key,
            label: quarterLabel(parts.year, parts.quarter),
            year: parts.year,
            quarter: parts.quarter,
            jobsYoy: jobsYoyByDisplayKey.has(key) ? jobsYoyByDisplayKey.get(key) : null,
            volumeYoy: volumeYoyByKey.has(key) ? volumeYoyByKey.get(key) : null
        };
    });
}

function cagedVolumeYoyAxis(values) {
    const valid = values.filter(Number.isFinite);
    if (!valid.length) return { min: -10, max: 10, step: 5 };
    let min = Math.min(...valid, 0);
    let max = Math.max(...valid, 0);
    const span = Math.max(max - min, 10);
    const pad = Math.max(span * 0.12, 2);
    const step = 5;
    return {
        min: Math.floor((min - pad) / step) * step,
        max: Math.ceil((max + pad) / step) * step,
        step
    };
}

function cagedPctNumber(value, digits=0) {
    if (!Number.isFinite(value)) return 'n.m.';
    const abs = Math.abs(value).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
    return value < 0 ? `(${abs}%)` : `${abs}%`;
}

function cagedTightPercentAxis(values) {
    const valid = values.filter(Number.isFinite);
    if (!valid.length) return { min: 0, max: 1, step: 0.5 };
    let min = Math.min(...valid);
    let max = Math.max(...valid);
    if (min === max) {
        min -= 0.5;
        max += 0.5;
    }
    const span = Math.max(max - min, 0.5);
    const pad = Math.max(span * 0.035, 0.08);
    const paddedMin = min - pad;
    const paddedMax = max + pad;
    const range = paddedMax - paddedMin;
    const step = range <= 2 ? 0.5 : range <= 6 ? 1 : range <= 12 ? 2 : 5;
    return {
        min: Math.floor(paddedMin / step) * step,
        max: Math.ceil(paddedMax / step) * step,
        step
    };
}

function cagedBarPercentAxis(values) {
    const valid = values.filter(Number.isFinite);
    if (!valid.length) return { min: 0, max: 10, step: 2 };
    const max = Math.max(...valid, 0);
    const paddedMax = max + Math.max(max * 0.10, 0.8);
    const step = paddedMax <= 6 ? 1 : paddedMax <= 12 ? 2 : paddedMax <= 25 ? 5 : 10;
    return { min: 0, max: Math.ceil(paddedMax / step) * step, step };
}

function cagedChurnMonthlySpotRows() {
    const jobsByKey = new Map(cagedJobsMonthlyRows().map(row => [row.key, row]));
    return cagedSourceRows().map(row => {
        const jobs = jobsByKey.get(row.key);
        if (!jobs) return null;
        const endJobs = jobs.value;
        const startJobs = endJobs - row.net;
        const avgJobs = (startJobs + endJobs) / 2;
        return {
            key: row.key,
            year: row.year,
            month: row.month,
            label: row.label,
            admissions: row.admissions,
            separations: row.separations,
            avgJobs,
            churn: avgJobs ? (row.separations / avgJobs) * 100 : null,
            grossTurnover: avgJobs ? ((row.admissions + row.separations) / avgJobs) * 100 : null
        };
    }).filter(Boolean);
}

function cagedChurnAggregateRows(rows, grain) {
    const groups = new Map();
    rows.forEach(row => {
        const q = grain === 'quarterly' ? quarterOf(row.month) : null;
        const key = grain === 'quarterly' ? `${row.year}-Q${q}` : String(row.year);
        const label = grain === 'quarterly' ? quarterLabel(row.year, q) : String(row.year);
        if (!groups.has(key)) groups.set(key, { key, year: row.year, quarter: q, label, rows: [] });
        groups.get(key).rows.push(row);
    });
    const minRows = grain === 'quarterly' ? 3 : 12;
    return Array.from(groups.values())
        .filter(group => group.rows.length === minRows)
        .sort((a, b) => a.key.localeCompare(b.key))
        .map(group => {
            const admissions = group.rows.reduce((sum, row) => sum + row.admissions, 0);
            const separations = group.rows.reduce((sum, row) => sum + row.separations, 0);
            const avgJobs = group.rows.reduce((sum, row) => sum + row.avgJobs, 0) / group.rows.length;
            return {
                key: group.key,
                year: group.year,
                quarter: group.quarter,
                label: group.label,
                admissions,
                separations,
                avgJobs,
                churn: avgJobs ? (separations / avgJobs) * 100 : null,
                grossTurnover: avgJobs ? ((admissions + separations) / avgJobs) * 100 : null
            };
        });
}

function cagedChurnSpotRows(grain=cagedChurnState.grain) {
    const monthly = cagedChurnMonthlySpotRows();
    if (grain === 'monthly') return monthly;
    return cagedChurnAggregateRows(monthly, grain);
}

function cagedChurnLtmRows(grain=cagedChurnState.grain) {
    if (grain === 'annual') return cagedChurnSpotRows('annual');
    const spotRows = cagedChurnSpotRows(grain);
    const windowSize = grain === 'monthly' ? 12 : 4;
    const out = [];
    for (let i = windowSize - 1; i < spotRows.length; i++) {
        const windowRows = spotRows.slice(i - windowSize + 1, i + 1);
        const admissions = windowRows.reduce((sum, row) => sum + row.admissions, 0);
        const separations = windowRows.reduce((sum, row) => sum + row.separations, 0);
        const avgJobs = windowRows.reduce((sum, row) => sum + row.avgJobs, 0) / windowRows.length;
        out.push({
            ...spotRows[i],
            admissions,
            separations,
            avgJobs,
            churn: avgJobs ? (separations / avgJobs) * 100 : null,
            grossTurnover: avgJobs ? ((admissions + separations) / avgJobs) * 100 : null
        });
    }
    return out;
}

function renderCagedChurnChart() {
    if (cagedChurnChartInstance) { cagedChurnChartInstance.destroy(); cagedChurnChartInstance = null; }
    const el = document.getElementById('caged-churn-chart');
    if (!el) return;
    if (cagedIsCompare()) {
        const s = cagedCompareSeries(() => cagedChurnSelectedRows());
        if (!s.keys.length) return;
        cagedChurnChartInstance = buildCagedCompareLine(el, s.labels, [
            { key: 'vulcabras', label: 'Vulcabras', borderColor: C.azulEscuro, data: s.keys.map(k => s.vu.has(k) ? s.vu.get(k).churn : null) },
            { key: 'dass', label: 'Grupo Dass', borderColor: C.cereja, data: s.keys.map(k => s.da.has(k) ? s.da.get(k).churn : null) },
        ], { valueFormatter: cagedComparePctFmt, frequency: cagedChurnState.grain });
        return;
    }
    const rows = cagedChurnSelectedRows();
    if (!rows.length) return;
    const churn = rows.map(row => row.churn);
    const validChurn = churn.filter(Number.isFinite);
    const avg = validChurn.length ? validChurn.reduce((sum, value) => sum + value, 0) / validChurn.length : 0;
    const avgValues = rows.map(() => avg);
    const axis = cagedBarPercentAxis([...churn, avg]);
    const anchor = rows[rows.length - 1];
    const highlightedSet = new Set(rows.map((row, i) => {
        if (!anchor) return -1;
        if (cagedChurnState.grain === 'monthly') return row.month === anchor.month ? i : -1;
        if (cagedChurnState.grain === 'quarterly') return row.quarter === anchor.quarter ? i : -1;
        return i === rows.length - 1 ? i : -1;
    }).filter(i => i >= 0));
    const barColors = rows.map((row, i) => highlightedSet.has(i) ? C.turquesa : C.azulEscuro);
    const labelPlugin = {
        id: 'cagedChurnLabels',
        afterDatasetsDraw(chart) {
            const ctx = chart.ctx;
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const placedRects = [];
            const avoidOverlap = (x, y, w, h, top, bottom) => {
                let ny = y;
                for (let guard = 0; guard < 60; guard++) {
                    let hit = null;
                    for (const r of placedRects) {
                        if (x < r.x + r.w && x + w > r.x && ny < r.y + r.h && ny + h > r.y) { hit = r; break; }
                    }
                    if (!hit) break;
                    const up = hit.y - h - 2;
                    const down = hit.y + hit.h + 2;
                    const upOk = up >= top;
                    const downOk = down + h <= bottom;
                    if (upOk && (!downOk || Math.abs(up - y) <= Math.abs(down - y))) ny = up;
                    else if (downOk) ny = down;
                    else break;
                }
                return Math.max(top, Math.min(ny, bottom - h));
            };
            const zeroY = chart.scales.y.getPixelForValue(0);
            if (zeroY >= chart.chartArea.top && zeroY <= chart.chartArea.bottom) {
                ctx.strokeStyle = '#CFD8E3';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(chart.chartArea.left, zeroY);
                ctx.lineTo(chart.chartArea.right, zeroY);
                ctx.stroke();
            }
            if (chart.isDatasetVisible(1) && rows.length) {
                const y = chart.scales.y.getPixelForValue(avg);
                const text = cagedPctNumber(avg, 0);
                ctx.font = '800 11px Verdana';
                const bw = ctx.measureText(text).width + 14;
                const lineEnd = chart.chartArea.right - bw;
                ctx.strokeStyle = C.cereja;
                ctx.lineWidth = 2.25;
                ctx.setLineDash([6, 5]);
                ctx.beginPath();
                ctx.moveTo(chart.chartArea.left + 10, y);
                ctx.lineTo(lineEnd, y);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            if (chart.isDatasetVisible(0)) {
                const meta = chart.getDatasetMeta(0);
                meta.data.forEach((bar, i) => {
                    if (!Number.isFinite(churn[i])) return;
                    if (!highlightedSet.has(i)) return;
                    const text = cagedPctNumber(churn[i], 0);
                    const props = bar.getProps(['x', 'y', 'base', 'width'], true);
                    ctx.font = '800 11px Verdana';
                    if (ctx.measureText(text).width > props.width + 14) ctx.font = '800 10px Verdana';
                    const bw = ctx.measureText(text).width + 14;
                    const bh = 22;
                    const x = Math.max(4, Math.min(props.x - bw / 2, chart.width - bw - 4));
                    const barTop = Math.max(chart.chartArea.top, Math.min(props.y, props.base));
                    const barBottom = Math.min(chart.chartArea.bottom, Math.max(props.y, props.base));
                    const barHeight = Math.max(0, barBottom - barTop);
                    const labelCenterY = barHeight >= bh + 6 ? barTop + barHeight / 2 : barTop + Math.max(12, barHeight / 2);
                    const y = Math.max(chart.chartArea.top + 4, Math.min(labelCenterY - bh / 2, chart.chartArea.bottom - bh - 4));
                    ctx.fillStyle = barColors[i] || C.azulEscuro;
                    roundedRect(ctx, x, y, bw, bh, 3);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(text, x + bw / 2, y + bh / 2 + 0.5);
                    placedRects.push({ x, y, w: bw, h: bh });
                });
            }
            if (chart.isDatasetVisible(1) && rows.length) {
                const lineMeta = chart.getDatasetMeta(1);
                const point = lineMeta.data[lineMeta.data.length - 1];
                if (point) {
                    const text = cagedPctNumber(avg, 0);
                    ctx.font = '800 11px Verdana';
                    const bw = ctx.measureText(text).width + 14;
                    const bh = 22;
                    const x = chart.chartArea.right - bw;
                    const y0 = Math.max(chart.chartArea.top + 4, Math.min(point.y - bh / 2, chart.chartArea.bottom - bh - 4));
                    const y = avoidOverlap(x, y0, bw, bh, chart.chartArea.top + 4, chart.chartArea.bottom - 4);
                    ctx.fillStyle = C.cereja;
                    roundedRect(ctx, x, y, bw, bh, 3);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(text, x + bw / 2, y + bh / 2 + 0.5);
                }
            }
            ctx.restore();
        }
    };
    cagedChurnChartInstance = new Chart(el.getContext('2d'), {
        data:{
            labels: rows.map(row => row.label),

function cagedJobsYoyAxis(values) {
    const valid = values.filter(Number.isFinite);
    const step = 5;
    if (!valid.length) return { min: 0, max: step, step };
    let min = Math.min(...valid);
    let max = Math.max(...valid);
    if (min === max) {
        min -= 1;
        max += 1;
    }
    const span = max - min;
    const pad = Math.max(span * 0.18, 1.5);
    return {
        min: Math.min(0, Math.floor((min - pad) / step) * step),
        max: Math.max(0, Math.ceil((max + pad) / step) * step),
        step
    };
}

function cagedJobsHighlightedIndices(rows) {
    const anchor = rows[rows.length - 1];

    if (cagedJobsState.grain === 'monthly') return rows.map((row, i) => row.month === anchor.month ? i : -1).filter(i => i >= 0);
    if (cagedJobsState.grain === 'quarterly') return rows.map((row, i) => row.quarter === anchor.quarter ? i : -1).filter(i => i >= 0);
    return [rows.length - 1];
}

function cagedMonthlyComparisonMonthlyOptions() {
    return cagedSourceRows().map(row => ({
        ...row,
        label: `${MONTH_NAMES[row.month - 1]}/${row.year}`,
        quarter: quarterOf(row.month)
    }));
}

function cagedMonthlyComparisonQuarterlyOptions() {
    const groups = new Map();
    cagedSourceRows().forEach(row => {
        const q = quarterOf(row.month);
        const key = `${row.year}-Q${q}`;
        if (!groups.has(key)) groups.set(key, { key, year: row.year, quarter: q, label: quarterLabel(row.year, q), rows: [] });
        groups.get(key).rows.push(row);
    });
    return Array.from(groups.values())
        .filter(group => group.rows.length === 3)
        .sort((a, b) => a.key.localeCompare(b.key))
        .map(group => cagedSumRows(group.rows, { key: group.key, year: group.year, quarter: group.quarter, label: group.label }));
}

function cagedMonthlyComparisonOptions() {
    return cagedMonthlyComparisonState.grain === 'quarterly'
        ? cagedMonthlyComparisonQuarterlyOptions()
        : cagedMonthlyComparisonMonthlyOptions();
}

function cagedMonthlyComparisonPeriods() {
    const field = cagedMonthlyComparisonState.grain === 'quarterly' ? 'quarter' : 'month';
    return [...new Set(cagedMonthlyComparisonOptions().map(row => row[field]))].sort((a, b) => a - b);
}

function cagedMonthlyComparisonSelectedPeriod() {
    return cagedMonthlyComparisonState.grain === 'quarterly'
        ? cagedMonthlyComparisonState.quarter
        : cagedMonthlyComparisonState.month;
}

function cagedMonthlyComparisonYearsForPeriod(period) {
    const field = cagedMonthlyComparisonState.grain === 'quarterly' ? 'quarter' : 'month';
    return [...new Set(cagedMonthlyComparisonOptions()
        .filter(row => row[field] === period)
        .map(row => row.year))]
        .sort((a, b) => a - b);
}

function ensureCagedMonthlyComparisonState() {
    const rows = cagedMonthlyComparisonOptions();
    if (!rows.length) return;
    const latest = rows[rows.length - 1];
    const periods = cagedMonthlyComparisonPeriods();
    if (cagedMonthlyComparisonState.grain === 'quarterly') {
        if (!cagedMonthlyComparisonState.quarter || !periods.includes(cagedMonthlyComparisonState.quarter)) {
            cagedMonthlyComparisonState.quarter = latest.quarter;
        }
    } else if (!cagedMonthlyComparisonState.month || !periods.includes(cagedMonthlyComparisonState.month)) {
        cagedMonthlyComparisonState.month = latest.month;
    }
    const years = cagedMonthlyComparisonYearsForPeriod(cagedMonthlyComparisonSelectedPeriod());
    if (!years.length) return;
    if (!cagedMonthlyComparisonState.fromYear || !years.includes(cagedMonthlyComparisonState.fromYear)) {
        cagedMonthlyComparisonState.fromYear = years[0];
    }
    if (!cagedMonthlyComparisonState.toYear || !years.includes(cagedMonthlyComparisonState.toYear)) {
        cagedMonthlyComparisonState.toYear = years[years.length - 1];
    }
    if (cagedMonthlyComparisonState.fromYear > cagedMonthlyComparisonState.toYear) {
        [cagedMonthlyComparisonState.fromYear, cagedMonthlyComparisonState.toYear] = [cagedMonthlyComparisonState.toYear, cagedMonthlyComparisonState.fromYear];
    }
}

function cagedMonthlyComparisonRows() {
    ensureCagedMonthlyComparisonState();
    const { fromYear, toYear } = cagedMonthlyComparisonState;
    const field = cagedMonthlyComparisonState.grain === 'quarterly' ? 'quarter' : 'month';
    const period = cagedMonthlyComparisonSelectedPeriod();
    return cagedMonthlyComparisonOptions()
        .filter(row => row[field] === period && row.year >= fromYear && row.year <= toYear)
        .sort((a, b) => a.year - b.year);
}

function cagedNumber(value) {
    const rounded = Math.round(Number(value) || 0);
    const abs = Math.abs(rounded).toLocaleString('en-US');
    return rounded < 0 ? `(${abs})` : abs;
}

function niceCagedStep(range, targetTicks=6) {
    const raw = Math.max(Number(range || 0) / targetTicks, 25);
    const magnitude = Math.pow(10, Math.floor(Math.log10(raw)));
    const normalized = raw / magnitude;
    if (normalized <= 1) return magnitude;
    if (normalized <= 2) return 2 * magnitude;
    if (normalized <= 2.5) return 2.5 * magnitude;
    if (normalized <= 5) return 5 * magnitude;
    return 10 * magnitude;
}

function cagedAxisBounds(values, options={}) {
    const valid = values.map(Number).filter(Number.isFinite);
    const includeZero = options.includeZero !== false;
    const padRatio = options.padRatio ?? 0.07;
    const targetTicks = options.targetTicks ?? 6;
    const minSpan = options.minSpan ?? 50;
    if (!valid.length) return { min: 0, max: 100, step: 25 };
    let min = Math.min(...valid);
    let max = Math.max(...valid);
    if (includeZero) {
        min = Math.min(min, 0);
        max = Math.max(max, 0);
    }
    if (min === max) {
        min -= minSpan / 2;
        max += minSpan / 2;
        if (includeZero) min = Math.min(min, 0);
    }
    const span = Math.max(max - min, minSpan);
    const pad = Math.max(span * padRatio, minSpan * 0.15);
    let paddedMin = min - pad;
    let paddedMax = max + pad;
    if (includeZero && min >= 0) paddedMin = 0;
    if (includeZero && max <= 0) paddedMax = 0;
    const step = options.stepSize || niceCagedStep(paddedMax - paddedMin, targetTicks);
    return {
        min: Math.floor(paddedMin / step) * step,
        max: Math.ceil(paddedMax / step) * step,
        step
    };
}

function vivaraCagedRows(scope='Core') {
    return (window.VIVARA_CAGED_DATA && window.VIVARA_CAGED_DATA.rows ? window.VIVARA_CAGED_DATA.rows : [])
        .filter(row => row.scope === scope)
        .map(row => ({
            key: periodKey(Number(row.year), Number(row.month)),
            year: Number(row.year),
            month: Number(row.month),
            label: monthLabel(Number(row.year), Number(row.month)),
            admissions: Number(row.admissions || 0),
            separations: Number(row.separations || 0),
            net: Number(row.net || 0),
        }))
        .sort((a, b) => a.key.localeCompare(b.key));
}

function vivaraCagedLtmRows(scope='Core') {
    const rows = vivaraCagedRows(scope);
    const out = [];
    for (let i = 11; i < rows.length; i++) {
        const windowRows = rows.slice(i - 11, i + 1);
        out.push(cagedSumRows(windowRows, rows[i]));
    }
    return out;
}

function vivaraCagedAnnualRows() {
    const scopes = ['Core', 'Expanded'];
    const years = new Map();
    scopes.forEach(scope => {
        vivaraCagedRows(scope).forEach(row => {
            if (!years.has(row.year)) years.set(row.year, { year: row.year, Core: null, Expanded: null });
            const target = years.get(row.year);
            if (!target[scope]) target[scope] = { admissions: 0, separations: 0, net: 0 };
            target[scope].admissions += row.admissions;
            target[scope].separations += row.separations;
            target[scope].net += row.net;
        });
    });
    return Array.from(years.values()).sort((a, b) => a.year - b.year);
}

function vivaraCagedCnaeTotals() {
    const labels = (window.VIVARA_CAGED_DATA && window.VIVARA_CAGED_DATA.filters && window.VIVARA_CAGED_DATA.filters.expanded_cnaes) || {};
    const rows = (window.VIVARA_CAGED_DATA && window.VIVARA_CAGED_DATA.by_cnae_rows) || [];
    const totals = new Map();
    rows.forEach(row => {
        if (!totals.has(row.scope)) totals.set(row.scope, { cnae: row.scope, label: labels[row.scope] || row.scope, admissions: 0, separations: 0, net: 0 });
        const target = totals.get(row.scope);
        target.admissions += Number(row.admissions || 0);
        target.separations += Number(row.separations || 0);
        target.net += Number(row.net || 0);
    });
    return Array.from(totals.values()).sort((a, b) => Math.abs(b.admissions + b.separations) - Math.abs(a.admissions + a.separations));
}

// RECEITA ÚNICA: config + pesos + cálculo da cesta vêm do índice compartilhado (charts-registry.js,
// window.COST_INDEX) → a apresentação consome a MESMA lógica; mudar uma série aqui propaga pros 2 lados.
// Fallback local idêntico, só pro caso (improvável) do registry não ter carregado.
const COST_INDEX_CONFIG = (window.COST_INDEX && window.COST_INDEX.CONFIG) || {
    eva: { label: 'EVA', description: '75% Ethylene CFR SE Asia + 25% Vinyl Acetate Huadong converted to USD', fields: { usd: 'eva_usd', brl: 'eva_brl' } },
    pvc: { label: 'PVC', description: 'PVC Houston FAS', fields: { usd: 'pvc_usd', brl: 'pvc_brl' } },
    rubber: { label: 'Rubber', description: '50% Butadiene Rotterdam + 50% Styrene FOB US Gulf', fields: { usd: 'rubber_usd', brl: 'rubber_brl' } },
    blended: { label: 'Petrochemical Cost Index', description: 'Weighted basket — 57.1% EVA + 21.4% Rubber + 21.4% PVC (the 20.0% / 7.5% / 7.5% of total cost, renormalized to 100%). Each component rebased to 1.0 at 2014-05-23, the first week all three series are available, so the index reflects only relative variation.', fields: { usd: 'eva_usd', brl: 'eva_brl' } },
};

function costIndexBlendedSeries(currency) {
    if (window.COST_INDEX && window.COST_INDEX.blendedSeries) return window.COST_INDEX.blendedSeries(currency);
    const WEIGHTS = { eva: 0.20 / 0.35, rubber: 0.075 / 0.35, pvc: 0.075 / 0.35 };
    const f = { eva: `eva_${currency}`, pvc: `pvc_${currency}`, rubber: `rubber_${currency}` };
    const data = (window.SPORTS_RETAIL_COST_INDEX_DATA || [])
        .filter(row => [f.eva, f.pvc, f.rubber].every(k => row[k] !== null && row[k] !== undefined))
        .sort((a, b) => a.week_date.localeCompare(b.week_date));
    const map = new Map();
    if (!data.length) return map;
    const base = data[0];
    const b = { eva: Number(base[f.eva]), pvc: Number(base[f.pvc]), rubber: Number(base[f.rubber]) };
    data.forEach(row => {
        map.set(row.week_date,
            WEIGHTS.eva * (Number(row[f.eva]) / b.eva) +
            WEIGHTS.rubber * (Number(row[f.rubber]) / b.rubber) +
            WEIGHTS.pvc * (Number(row[f.pvc]) / b.pvc));
    });
    return map;
}

function costIndexDateLabel(dateKey) {
    const d = new Date(`${dateKey}T00:00:00`);
    if (Number.isNaN(d.getTime())) return dateKey || '';
    return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getFullYear()).slice(-2)}`;
}

function costIndexAxisDateLabel(dateKey) {
    const d = new Date(`${dateKey}T00:00:00`);
    if (Number.isNaN(d.getTime())) return dateKey || '';
    return `${MONTH_NAMES[d.getMonth()]}/${String(d.getFullYear()).slice(-2)}`;
}

function costIndexRows() {
    if (costIndexState.variable === 'blended') {
        return Array.from(costIndexBlendedSeries(costIndexState.currency).entries())
            .map(([date, value]) => ({
                key: date,
                label: costIndexDateLabel(date),
                axisLabel: costIndexAxisDateLabel(date),
                value,
            }))
            .sort((a, b) => a.key.localeCompare(b.key));
    }
    const cfg = COST_INDEX_CONFIG[costIndexState.variable] || COST_INDEX_CONFIG.eva;
    const field = cfg.fields[costIndexState.currency] || cfg.fields.usd;
    return (window.SPORTS_RETAIL_COST_INDEX_DATA || [])
        .map(row => ({
            key: row.week_date,
            label: costIndexDateLabel(row.week_date),
            axisLabel: costIndexAxisDateLabel(row.week_date),
            value: row[field] === null || row[field] === undefined ? null : Number(row[field]),
        }))
        .filter(row => Number.isFinite(row.value))
        .sort((a, b) => a.key.localeCompare(b.key));
}

function ensureCostIndexRange() {
    const rows = costIndexRows();
    if (!rows.length) return rows;
    const keys = rows.map(row => row.key);
    if (!costIndexState.from || !keys.includes(costIndexState.from)) costIndexState.from = keys[0];
    if (!costIndexState.to || !keys.includes(costIndexState.to)) costIndexState.to = keys[keys.length - 1];
    if (costIndexState.from > costIndexState.to) [costIndexState.from, costIndexState.to] = [costIndexState.to, costIndexState.from];
    return rows;
}

function filteredCostIndexRows() {
    return ensureCostIndexRange().filter(row => row.key >= costIndexState.from && row.key <= costIndexState.to);
}

function costIndexSelect(id, current, onchangeFn, rows, width=126) {
    return `<select id="${id}" class="df-input" onchange="${onchangeFn}" style="width:${width}px;">${rows.map(row => `<option value="${row.key}" ${row.key === current ? 'selected' : ''}>${row.label}</option>`).join('')}</select>`;
}

function costIndexRangeOptions(rows, mode) {
    const months = new Map();
    rows.forEach(row => {
        const monthKey = row.key.slice(0, 7);
        const option = { key: row.key, label: row.axisLabel };
        if (mode === 'to' || !months.has(monthKey)) months.set(monthKey, option);
    });
    return Array.from(months.values());
}

function fmtCostValue(value, compact=false) {
    if (!Number.isFinite(value)) return 'n.m.';
    const number = Number(value).toLocaleString('en-US', { minimumFractionDigits: compact ? 1 : 2, maximumFractionDigits: compact ? 1 : 2 });
    return number;
}

function calcAverage(values) {
    const valid = values.filter(Number.isFinite);
    if (!valid.length) return null;
    return valid.reduce((sum, value) => sum + value, 0) / valid.length;
}

function calcStdDev(values) {
    const valid = values.filter(Number.isFinite);
    if (!valid.length) return null;
    const avg = calcAverage(valid);
    return Math.sqrt(valid.reduce((sum, value) => sum + Math.pow(value - avg, 2), 0) / valid.length);
}

function costIndexNiceStep(rawStep) {
    const steps = [0.01, 0.02, 0.05, 0.10, 0.20, 0.25, 0.50, 1.00, 2.00, 5.00];
    return steps.find(step => step >= rawStep) || steps[steps.length - 1];
}

function costIndexAxisRange(values) {
    const valid = values.filter(Number.isFinite);
    if (!valid.length) return { min: 0, max: 1, step: 0.25 };
    const minValue = Math.min(...valid);
    const maxValue = Math.max(...valid);
    const range = Math.max(maxValue - minValue, 0.10);
    const step = costIndexNiceStep(range / 8);
    let min = Math.floor((minValue - step * 0.35) / step) * step;
    let max = Math.ceil((maxValue + step * 0.35) / step) * step;
    if (min === max) max += step;
    return {
        min: Number(Math.max(0, min).toFixed(4)),
        max: Number(max.toFixed(4)),
        step: Number(step.toFixed(4)),
    };
}

function costIndexTablePeriodLabel(row) {
    if (costIndexTableState.grain === 'weekly') return costIndexDateLabel(row.key);
    if (costIndexTableState.grain === 'monthly') return monthLabel(row.year, row.month);
    if (costIndexTableState.grain === 'quarterly') return quarterLabel(row.year, row.quarter);
    return String(row.year);
}

function costIndexIsoDate(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function costIndexAddDays(dateKey, days) {
    const d = new Date(`${dateKey}T00:00:00`);
    d.setDate(d.getDate() + days);
    return costIndexIsoDate(d);
}

function costIndexTablePeriodKeyForDate(date) {
    if (!date || !Number.isFinite(date.year) || !Number.isFinite(date.month)) return null;
    if (costIndexTableState.grain === 'weekly') return date.key || null;
    if (costIndexTableState.grain === 'monthly') return periodKey(date.year, date.month);
    if (costIndexTableState.grain === 'quarterly') return `${date.year}-Q${quarterOf(date.month)}`;
    return String(date.year);
}

function costIndexTableParseStart(key) {
    if (!key) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(key)) {
        const d = new Date(`${key}T00:00:00`);
        return { key, year: d.getFullYear(), month: d.getMonth() + 1 };
    }
    return parsePeriodStart(key);
}

function costIndexTableParseEnd(key) {
    if (!key) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(key)) {
        const d = new Date(`${key}T00:00:00`);
        return { key, year: d.getFullYear(), month: d.getMonth() + 1 };
    }
    return parsePeriodEnd(key);
}

function costIndexTableWeeklyRows() {
    let rows;
    if (costIndexTableState.variable === 'blended') {
        const usdMap = costIndexBlendedSeries('usd');
        const brlMap = costIndexBlendedSeries('brl');
        const dates = Array.from(new Set([...usdMap.keys(), ...brlMap.keys()])).sort((a, b) => a.localeCompare(b));
        rows = dates.map(date => {
            const d = new Date(`${date}T00:00:00`);
            return {
                key: date,
                year: d.getFullYear(),
                month: d.getMonth() + 1,
                quarter: quarterOf(d.getMonth() + 1),
                label: costIndexDateLabel(date),
                usd: usdMap.has(date) ? usdMap.get(date) : null,
                brl: brlMap.has(date) ? brlMap.get(date) : null,
                forecast: false,
            };
        }).filter(row => Number.isFinite(row.usd) || Number.isFinite(row.brl));
    } else {
        const cfg = COST_INDEX_CONFIG[costIndexTableState.variable] || COST_INDEX_CONFIG.eva;
        rows = (window.SPORTS_RETAIL_COST_INDEX_DATA || [])
            .map(row => {
                const d = new Date(`${row.week_date}T00:00:00`);
                return {
                    key: row.week_date,
                    year: d.getFullYear(),
                    month: d.getMonth() + 1,
                    quarter: quarterOf(d.getMonth() + 1),
                    label: costIndexDateLabel(row.week_date),
                    usd: row[cfg.fields.usd] === null || row[cfg.fields.usd] === undefined ? null : Number(row[cfg.fields.usd]),
                    brl: row[cfg.fields.brl] === null || row[cfg.fields.brl] === undefined ? null : Number(row[cfg.fields.brl]),
                    forecast: false,
                };
            })
            .filter(row => Number.isFinite(row.usd) || Number.isFinite(row.brl))
            .sort((a, b) => a.key.localeCompare(b.key));
    }
    if (costIndexTableState.forecast !== 'on' || !rows.length) return rows;
    const last = rows[rows.length - 1];
    const projected = [];
    for (let i = 1; i <= 52; i++) {
        const key = costIndexAddDays(last.key, i * 7);
        const d = new Date(`${key}T00:00:00`);
        projected.push({
            key,
            year: d.getFullYear(),
            month: d.getMonth() + 1,
            quarter: quarterOf(d.getMonth() + 1),
            label: costIndexDateLabel(key),
            usd: last.usd,
            brl: last.brl,
            forecast: true,
        });
    }
    return rows.concat(projected);
}

function costIndexTableAvg(rows, field) {
    const values = rows.map(row => row[field]).filter(Number.isFinite);
    if (!values.length) return null;
    return values.reduce((sum, value) => sum + value, 0) / values.length;
}

function costIndexTableRows() {
    const weekly = costIndexTableWeeklyRows();
    if (costIndexTableState.grain === 'weekly') return weekly.map(row => ({ ...row, label: costIndexTablePeriodLabel(row) }));
    const groups = new Map();
    weekly.forEach(row => {
        const key = costIndexTableState.grain === 'monthly'
            ? periodKey(row.year, row.month)
            : costIndexTableState.grain === 'quarterly'
                ? `${row.year}-Q${row.quarter}`
                : String(row.year);
        if (!groups.has(key)) groups.set(key, { key, year: row.year, month: row.month, quarter: row.quarter, weeks: [] });
        groups.get(key).weeks.push(row);
    });
    return Array.from(groups.values()).map(group => ({
        key: group.key,
        year: group.year,
        month: group.month,
        quarter: group.quarter,
        label: costIndexTablePeriodLabel(group),
        usd: costIndexTableAvg(group.weeks, 'usd'),
        brl: costIndexTableAvg(group.weeks, 'brl'),
        forecast: group.weeks.some(row => row.forecast),
    })).sort((a, b) => a.key.localeCompare(b.key));
}

function ensureCostIndexTableRange() {
    const rows = costIndexTableRows();
    if (!rows.length) return rows;
    const keys = rows.map(row => row.key);
    if (!costIndexTableState.from || !keys.includes(costIndexTableState.from)) costIndexTableState.from = keys[0];
    if (!costIndexTableState.to || !keys.includes(costIndexTableState.to)) costIndexTableState.to = keys[keys.length - 1];
    if (keys.indexOf(costIndexTableState.from) > keys.indexOf(costIndexTableState.to)) {
        [costIndexTableState.from, costIndexTableState.to] = [costIndexTableState.to, costIndexTableState.from];
    }
    return rows;
}

function costIndexTableSelect(id, current, onchangeFn) {

}

function costIndexTableControlsHtml() {

    return `<div class="imports-controls" style="display:flex;align-items:flex-end;justify-content:flex-end;gap:18px;flex-wrap:wrap;margin-left:auto;">
