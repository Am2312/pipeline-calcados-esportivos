name: Pipeline Calçados Esportivos

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 07:00 BRT (UTC-3)
  workflow_dispatch:        # permite rodar manualmente no GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # A Nike (Akamai Bot Manager) exige sensor JS desde 02/08/2026: requisição
      # crua toma 403 em qualquer IP. O motor da Nike usa camoufox (Firefox
      # anti-detect) em display virtual: abre a home (que passa e valida os
      # cookies) e busca a listagem por fetch same-origin. Ver
      # nike-akamai-datacenter-block / commit da sonda 30825731327.
      - name: Instalar camoufox (browser da coleta Nike)
        run: |
          python -m camoufox fetch
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Configurar credenciais GCP
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/gcp_creds.json
        # Nota: o arquivo é criado em /tmp e apagado ao fim do runner

      - name: Rodar pipeline
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_creds.json
          PYTHONIOENCODING: utf-8
          NIKE_ENGINE: camoufox
          # Se a Nike voltar a bloquear por IP (e não só por sensor), basta
          # reinstalar o Cloudflare WARP em modo proxy SOCKS5 e setar
          # NIKE_PROXY=socks5h://127.0.0.1:40000 (+ NIKE_PROXY_RESET_CMD=
          # "bash warp_rotate.sh 127.0.0.1:40000" para rotacionar o IP de saída).
        run: python pipeline_adidas_nike_bq.py
