name: Pipeline Calçados Esportivos

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 07:00 BRT (UTC-3)
  workflow_dispatch:        # permite rodar manualmente no GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # A Nike (Akamai) NEGA IP de datacenter nas rotas de produto. Saímos por
      # Cloudflare WARP (grátis, sem conta) em modo proxy SOCKS5 :40000, que dá
      # um IP aceito pelo Akamai. Só o scraper da Nike usa esse proxy (NIKE_PROXY);
      # o resto (Adidas/UA/Asics/Netshoes/BQ) vai direto. Ver nike-akamai-datacenter-block.
      - name: Instalar Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

      - name: Conectar WARP (proxy SOCKS5 :40000)
        run: |
          sudo systemctl start warp-svc || (sudo warp-svc >/tmp/warpsvc.log 2>&1 &)
          sleep 6
          warp-cli --accept-tos registration new || warp-cli --accept-tos register || true
          warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy || true
          warp-cli --accept-tos connect || true
          sleep 6
          warp-cli --accept-tos status || true
          # Confirma que o SOCKS5 do WARP está de pé (warp=on). Falha o job se não subiu.
          curl -s --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'
          curl -s --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)='

      - name: Configurar credenciais GCP
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/gcp_creds.json
        # Nota: o arquivo é criado em /tmp e apagado ao fim do runner

      - name: Rodar pipeline
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_creds.json
          PYTHONIOENCODING: utf-8
          NIKE_PROXY: socks5h://127.0.0.1:40000   # Nike sai pelo WARP; resto vai direto
          # O IP do WARP é sorteado e o Akamai da Nike só aceita parte deles: se
          # a Nike for negada, o pipeline roda este comando (nova registration =
          # novo IP de saída) e tenta de novo, até NIKE_MAX_EGRESS_TRIES vezes.
          NIKE_PROXY_RESET_CMD: bash warp_rotate.sh 127.0.0.1:40000
          NIKE_MAX_EGRESS_TRIES: '6'
        run: python pipeline_adidas_nike_bq.py
