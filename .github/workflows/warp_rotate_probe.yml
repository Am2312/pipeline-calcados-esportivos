name: Nike WARP Rotate Probe (temp)

# Sonda TEMPORÁRIA. Remover depois de decidir o caminho da Nike.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium

      - name: Sonda navegador real (Playwright) na Nike
        env:
          PYTHONIOENCODING: utf-8
        run: python nike_playwright_probe.py
